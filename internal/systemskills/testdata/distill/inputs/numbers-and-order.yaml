lessons:
  - key: zeta
    layer: content
    what: zero impact because fact a is missing from an empty list
    notable: n
    where: [src@abcdef1]
    contrast: new
    score: {relevance: 3, facts: [], evidence: 3, effort: 1, why: w, impact: 9}
    final_score: 99
    decision: {state: candidate}
  - key: two-thirds
    layer: wording
    what: w
    notable: n
    where: ['src@abcdef1:docs/a.md#L1-L2']
    contrast: already-covered
    score: {relevance: 1, facts: [a, b], evidence: 1, effort: 3, why: w}
    decision: {state: ported, at: '1234567'}
  - key: alpha
    layer: craft
    what: w
    notable: n
    where: [src@abcdef1]
    contrast: contradicts
    score: {relevance: 2, facts: [a], evidence: 2, effort: 3, why: w}
    decision: {state: candidate}
  - key: beta
    layer: enforcement
    what: w
    notable: n
    where: [src@abcdef1]
    contrast: contradicts
    score: {relevance: 2, facts: [a], evidence: 2, effort: 3, why: w}
    decision: {state: candidate}
  - key: aaa
    layer: craft
    what: w
    notable: n
    where: [src@abcdef1]
    contrast: contradicts
    score: {relevance: 2, facts: [a], evidence: 2, effort: 3, why: w}
    also_fits: [hub, new-skill:x, other-skill]
    status: superseded-by:alpha
    found_by: human
    decision: {state: candidate}
  - key: max
    layer: history
    what: w
    notable: n
    where: [src@abcdef1]
    contrast: extends
    score: {relevance: 3, facts: [a, b, c, d, e], evidence: 3, effort: 1, why: w}
    decision: {reason: kept for later, state: planned, at: abcdef1}
  - key: half
    layer: validation
    what: w
    notable: n
    where: [src@abcdef1]
    contrast: extends
    score: {relevance: 3, facts: [a, b, c], evidence: 1, effort: 2, why: w}
    decision: {state: candidate}
coverage:
  numbers:
    floats: [1.0e+16, 1e16, 1.5e-5, 0.0001, 0.00001, 123456789012345.6, 1234567890123456.0, -0.0, .inf, -.inf, .nan, 2.675, 0.1]
    ints: [0, -5, 017, 0x1f, 1_000, 1:30, 12345678901234567890123]
    other: [true, false, null, ~]
cursors:
  src: abcdef1234567890
goal:
  failures_it_prevents: [f]
  out_of_scope: [o]
  in_scope: [i]
  purpose: p
  status: draft
