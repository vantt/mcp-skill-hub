# Written by distill-lab/scripts/distill.py. Edit freely, then run `distill.py format`.
# impact = number of facts (a-e, a required); final_score = relevance x impact x evidence / effort;
# lessons are sorted by it,
# then by layer rank, then by key.
goal:
  status: confirmed
  purpose: >-
    Every test justifies its maintenance cost by protecting observable behavior, a credible
    regression, or an independently meaningful contract. The skill stops low-value tests at
    write time and removes the ones that already exist.
  in_scope:
    - authoring gate for new or changed tests
    - audits that find and remove junk, duplicate, and implementation-coupled tests
    - removing production seams, exports and dead code that only tests need
    - subsystem-wide pruning campaigns
    - keeping an audit's result from eroding after it lands
  out_of_scope:
    - writing features or fixing non-test production bugs
    - test-suite performance tuning and runner infrastructure
    - CI, release and live-environment proof routing
  failures_it_prevents:
    - junk tests accumulate (assertion-free probes, source greps, self-comparisons, copied
      fixtures)
    - tests break under behavior-preserving refactoring because they assert implementation
    - production code grows seams, exports and wrappers that only tests use
    - the same contract is tested at several layers
    - a test deletion silently loses the only proof of a contract
    - mocks implement the behavior the test claims to check
