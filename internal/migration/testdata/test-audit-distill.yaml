lessons:

  - key: mocks-mirror-the-real-shape
    layer: content
    what: >-
      A mock reproduces the complete real shape it replaces: every documented field of a response
      (superpowers), every export of a module (openclaw); a partial mock is a defect, not
      a shortcut.
    notable: >-
      Both sources reached this independently for the same reason: partial mocks fail silently,
      the test passes while integration breaks when downstream code reads what the mock omitted.
      test-audit lists mocks that implement the asserted behavior, but not mocks that are
      incomplete.
    where:
      - superpowers@8ca22dba9a94:skills/test-driven-development/writing-good-tests.md#L119-L122
      - openclaw@96370cf438dc:docs/help/testing/writing-tests.md#L121-L131
    contrast: extends
    score:
      relevance: 3
      facts: [a, b, c, d, e]
      impact: 5
      evidence: 3
      effort: 1
      why: >-
        a: partial mocks let a test pass while integration breaks; b: test-audit has no rule
        on incomplete mocks; c: both sources hit it; d: openclaw enforces export completeness
        with a checker; e: the failure is silent.
    final_score: 45.0
    also_fits: []
    decision: {state: candidate}

  - key: wait-on-owned-signal
    layer: content
    what: >-
      Async tests synchronize on the state an action produces (process ready, form committed,
      draft persisted), never on the action returning; time is controlled through an injected
      clock at the owner, not real timers, sleeps or polling.
    notable: >-
      Each rule is tied to a real incident (#125441, #125456, #125548), and the forbidden
      substitutes are listed explicitly: longer timeouts, sleeps, retry-wrapped assertions,
      trimmed expectations. For the goal it is a junk pattern the list lacks: a test that
      passes because it waited long enough, not because the owner signalled completion. Converges
      with superpowers, which reached the same principle independently and measured it: 15
      flaky tests fixed, pass rate 60% to 100%, 40% faster. The mechanisms differ: superpowers
      polls the condition with a timeout, openclaw forbids polling and waits on the owner's
      completion signal or an injected clock; both forbid guessing time.
    where:
      - openclaw@96370cf438dc:test/AGENTS.md#L4
      - openclaw@96370cf438dc:docs/help/testing/writing-tests.md#L93-L98
      - superpowers@8ca22dba9a94:skills/systematic-debugging/condition-based-waiting.md#L5-L7
      - superpowers@8ca22dba9a94:skills/systematic-debugging/condition-based-waiting.md#L95-L115
    contrast: extends
    score:
      relevance: 2
      facts: [a, b, c, d, e]
      impact: 5
      evidence: 3
      effort: 1
      why: >-
        a: a test passes because it waited long enough, not because the owner finished; b:
        missing from the junk list; c: three incidents plus 15 flaky tests in the other source;
