    decision: {state: candidate}

  - key: change-detector-test
    layer: history
    what: >-
      Before writing a test, name the production change that would make it fail and ask whether
      that change is a bug or a decision. A test that only intentional decisions can fail
      (a constant's value, exact wording, private structure) is a change detector: test the
      behavior that depends on the decision instead.
    notable: >-
      Added after a fresh-eyes review found a hole: a constant assertion can fail, uses a
      literal, mocks nothing, and still protects nothing; it fires on redesign and sleeps
      through bugs. test-audit's gate asks what regression makes a test fail but does not
      separate bugs from decisions, so change detectors pass it.
    where:
      - superpowers@e8a9748a3fa9
      - superpowers@8ca22dba9a94:skills/test-driven-development/writing-good-tests.md#L20-L25
      - superpowers@8ca22dba9a94:skills/test-driven-development/writing-good-tests.md#L41-L45
