  - key: no-source-text-assertions
    layer: content
    what: >-
      Asserting that a script, skill or config contains an exact line proves only that the
      source is the source; run the artifact and assert its effects. Documents for agents
      are tested by the consuming agent's behavior; prose for humans earns no test.
    notable: >-
      Agrees with test-audit's junk pattern on source and string greps, but is stricter: test-audit
      keeps source inspection when it is the cheapest independent guard, superpowers allows
      none. A real difference to decide, not a gap.
    where:
