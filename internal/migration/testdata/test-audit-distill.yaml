      unannotated factories held in a shrink-only baseline.
    notable: >-
      Turns "mocks that implement the asserted behavior" from a judgement call into a visible
      claim a reviewer can verify: every closed mock must say what it keeps out. The same
      "declare the exception inline" pattern guards production type assertions (`// SAFETY:`),
      so it is a general tool, not a one-off. The source also warns that pass-through mocks
      do not share singleton state, so export completeness is not identity.
    where:
