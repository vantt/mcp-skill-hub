    notable: >-
      A ban without a sanctioned replacement pushes authors toward the next workaround. The
      replacement removes the original failure mode at the root (it has no timer, so a slow
      runner cannot lose a race against a deadline), and the failure message makes the right
      fix the shortest path. test-audit removes junk patterns and test-only seams but never
      asks what the author should write instead.
