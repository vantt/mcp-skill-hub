  - key: ratchet-over-doctrine
    layer: enforcement
    what: >-
      A test-quality rule that is only written down is backed by a shrink-only ratchet: a
      checked-in per-file baseline of existing violations, a CI check that rejects new ones,
      and a --prune step that lowers the baseline as sites are removed. One shared library
      owns the ratchet lifecycle, and the source reuses it for at least five rules.
    notable: >-
      Evidence from history: the written rule against wall-clock timeout races did not hold,
      and call sites grew from 123 to 478 in under a month. The ratchet accepts existing debt
      instead of demanding a big-bang cleanup and still stops the rule from eroding. Three
      design details make it hard to evade: the baseline is compared at the branch's merge-base,
      so unrelated cleanup on main never looks like local growth; violations are counted on
      the syntax tree, so aliases, re-exports and local copies cannot hide one; and each grandfathered
      site has its own fingerprint, so a new site cannot borrow an old site's allowance. For
      the goal this closes the gap after an audit lands: test-audit removes junk but has nothing
      that keeps it from coming back.
    where:
      - openclaw@be052821d69
      - openclaw@96370cf438dc:docs/help/testing/writing-tests.md#L111-L117
      - openclaw@96370cf438dc:scripts/lib/shrink-ratchet.mts#L6-L9
      - openclaw@96370cf438dc:scripts/lib/shrink-ratchet.mts#L76-L82
      - openclaw@96370cf438dc:scripts/check-test-timeout-race-ratchet.mts#L12-L19
      - openclaw@96370cf438dc:scripts/check-test-timeout-race-ratchet.mts#L56-L58
      - openclaw@96370cf438dc:scripts/check-test-mock-exports.mts#L24-L25
      - openclaw@96370cf438dc:scripts/check-assertion-safety-ratchet.mts#L20-L25
    contrast: new
    score:
      relevance: 3
      facts: [a, b, c, d, e]
      impact: 5
      evidence: 3
      effort: 2
      why: >-
        a: junk returns after an audit lands; b: test-audit has nothing that keeps it out;
        c: the source runs five ratchets; d: it is a CI check; e: 123 to 478 sites under a
        doc-only rule.
    final_score: 22.5
    also_fits:
