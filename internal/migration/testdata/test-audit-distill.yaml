  - key: flake-triage-as-defect
    layer: content
    what: >-
      A failure without a related change is a defect. Reproduce in the failing shard's file
      order first, then alone; classify it as fixture (temp state, ports, cwd, env, singletons),
      ordering (assertion before the owned completion signal) or product race; fix at the
      owner, never in the victim test; prove with 20 clean standalone runs and 3 clean shard
      runs.
    notable: >-
      Order-only failures are read as shared-state leaks from an earlier file, so the fix
      goes to the producer, and serial configs or worker pins are refused as repairs. The
      source names every way to conceal a failure (retries, longer timeouts, weaker assertions,
      broader mocks, altered baselines) and closes the most common false claim in one line:
      "Never claim a passing replay proves a fix." Measured against the goal, this is test
      reliability, not test value, so it fits a separate skill better. superpowers ships a
      bisection script that finds which test file creates the polluting state, the same producer-first
      idea as openclaw's order-only rule.
    where:
      - openclaw@96370cf438dc:docs/help/testing/writing-tests.md#L175-L190
      - openclaw@96370cf438dc:.agents/skills/openclaw-testing/SKILL.md#L123-L135
