# distill learning area: goal, domains, sources (cursor + coverage) and intake.
# Written by distill.mjs; comments are not kept, so put reasons in fields. Lessons live in lessons/<domain>.yaml.
goal:
  status: draft
  purpose: >-
    Any MCP-capable agent, in any project, gets the right curated skill from one
    Git-owned library and loads only what its task needs, while the human keeps curated
    skills under their own control as upstream sources change.
  core_domains:
    - skill-over-mcp
    - skill-recommendation
  in_scope:
    - >-
      one curated skill library in Git, with provenance of every skill (repo, path,
      commit)
    - >-
      distribution over MCP with the official skills extension and progressive
      disclosure
    - server-side resolution and recommendation of the right skill for a task
    - upstream tracking, change detection, and learning from sources into curated skills
    - curation lifecycle with human approval of third-party content
    - runtime state (database, indexes, caches) rebuilt from the Git repository
    - feedback and telemetry that make resolution measurably better
  out_of_scope:
    - a public marketplace
    - executing upstream code automatically
    - auto-merging upstream changes into curated skills
    - replacing Git with a database server, or requiring a cloud service
    - installing skills into each IDE or project by copying
    - general-purpose agent orchestration
  failures_it_prevents:
    - skills copied into each project drift apart and go stale
    - an upstream change silently alters curated knowledge
    - the agent loads the wrong skill, or too much catalog and content, into its context
    - adding skills grows the agent's base context
    - a fresh clone on a new machine cannot rebuild a working hub
    - >-
      lessons from sources are lost, repeated, or applied without a record of what was
      incorporated
    - third-party skill content is served or run without the human's approval
    - nobody can tell whether a resolution or a skill change actually helped

domains:
  - name: skill-over-mcp
    definition: >-
      serving skills to agents over MCP: the skills extension (skills/list, skills/get,
      resources/read), manifests, digests, progressive loading of content and the
      context budget it costs
  - name: skill-recommendation
    definition: >-
      choosing the right skill for a task: retrieval, ranking, resolve outcomes
      (resolved, needs_context, no_skill), the explanation of why, and the context
      signals used
  - name: skill-sources
    definition: >-
      bringing skills in and keeping them current: source registry, ingestion, indexing,
      duplicates and upstream change detection
  - name: curation
    definition: >-
      the lifecycle of a curated skill: add, edit, review and approve, versions,
      preview/confirm mutations
  - name: source-learning
    definition: >-
      learning from upstream and reference sources: distillation, lessons, decisions and
      their application
  - name: storage
    definition: >-
      Git as the durable database: repository layout, derived runtime state, rebuild and
      portability
  - name: evaluation
    definition: >-
      proving it works: usage feedback, outcomes, telemetry, metrics, evals and
      experiments
  - name: trust-safety
    definition: >-
      what may run or be served: untrusted content, approval, sandboxing, secrets and
      supply chain
  - name: host-integration
    definition: >-
      connecting agents and hosts: install, configuration, agent instructions and
      per-host adapters
  - name: ux
    definition: >-
      how people and agents operate it: CLI, web UI, output formats, errors and
      documentation

