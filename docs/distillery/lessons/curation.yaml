  - key: closed-frontmatter-allowlist-churn
    domains:
      - curation
      - skill-sources
    layer: history
    what: >-
      `validate` and `add` treat any top-level SKILL.md key outside an allowlist as fatal
      (made fatal in 0274cae). When Claude Code 2.1.0 introduced model, context, agent,
      hooks and user-invocable, valid skills failed until a patch release allow-listed them
      as pass-through. Reserved-word and XML-tag checks were removed as "not in spec" and
      re-added three weeks later "per the specification".
    notable: >-
      A closed schema over a file format that vendors keep extending breaks valid skills on
      the vendor's release day. The host validates its own skill.meta.yaml strictly but only
      checks SKILL.md's name against the skill id, leaving other frontmatter verbatim as the
      skills extension requires, which avoids this churn; worth keeping when any SKILL.md
      lint is added (warn on unknown keys, never fail).
