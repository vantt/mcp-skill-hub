      - saker-skillhub@02fc275c4f4f
    contrast: new
    host: internal/skill/lifecycle.go
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: Adjacent (version lifecycle); the host has no per-version consumers to protect.
    final_score: 0
    keywords:
      - yank
      - unyank
      - deprecate
