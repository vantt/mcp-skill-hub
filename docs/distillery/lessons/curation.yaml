  - key: frozen-version-under-review
    domains:
      - curation
      - trust-safety
    layer: content
    what: >-
      A version under review is frozen in PENDING_REVIEW and cannot be edited. A new upload
      auto-withdraws the pending one (deleting its review task) instead of mutating it.
      Visibility requested at publish time is stored on the version and applied to the skill
      only when the review is approved. Only PUBLISHED versions are resolvable, downloadable
      or taggable.
    notable: >-
      An approval binds to exactly the bytes reviewed, and a pending change takes effect
      only on approval. The host does the same with a content digest in
      quality.content_reviewed_digest (stale when content changes) and preview/confirm
      proposals with confirmation pins. It is recorded as independent convergence.
