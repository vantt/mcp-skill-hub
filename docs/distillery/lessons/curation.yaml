  - key: baseline-failures-scope-the-skill
    domains:
      - curation
      - evaluation
    layer: validation
    what: >-
      The whole method rests on one rule stated in the manifest: "first discover what the
      agent fails at, then write only the minimal instructions to fill those failures".
      Phase 1 runs 3-5 representative tasks without the skill and records what it got wrong;
      Phase 3 re-checks research against those recorded failures; Phase 8 asks whether
      output improved versus that baseline and builds at least 3 scenarios (basic, edge,
      composite) in a {skills, query, files, expected_behavior} format.
    notable: >-
      A skill is justified and scoped by recorded failures, and its success is judged
      against the same record, so "did this skill/edit help?" has an answer. Trade-off: the
      baseline is manual agent runs, and the source never stores or checks it. For the host,
      `skill create` asks for routing fields and `eval routing` measures selection, but
      nothing records why a skill exists or whether it improved output; a cheap form is an
      optional meta field (observed failures + scenarios) that review shows and a later
      utility experiment can reuse. It complements the routing examples, which test
      selection, not effect.
    where:
      - skill-forge-mcp@3211174026e6:src/content/manifest.json#L4-L4
      - skill-forge-mcp@3211174026e6:src/content/phase_1.md#L31-L46
      - skill-forge-mcp@3211174026e6:src/content/phase_3.md#L1-L18
      - skill-forge-mcp@3211174026e6:src/content/phase_8.md#L5-L46
    contrast: new
    host: internal/app/skill_review.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - d
      impact: 3
      evidence: 1
      effort: 2
      why: >-
        In scope (feedback that proves improvement; curation lifecycle). a: a curated skill
        is created and edited with no record of the failure it fixes, so nobody can tell
        whether it helped (goal failure); b: no baseline or scenario field in skill meta or
        review; d: lands as a meta field shown by review. One source; related to
        ab-experiment-on-skill-variants, which needs volume this does not. Rescored
        2026-10-13: the confirmed purpose now names collecting, editing and tuning curated
        skills to the human's own criteria.
    final_score: 4.5
    keywords:
      - baseline measurement
      - failure patterns
      - evaluation scenarios
      - expected_behavior
    also_fits:
      - skill:system-curator
    decision: {state: candidate}

