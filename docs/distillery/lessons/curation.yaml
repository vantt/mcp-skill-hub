  - key: lifecycle-split-container-version-review
    domains:
      - curation
    layer: craft
    what: >-
      The lifecycle was rebuilt as four separate axes: container status (ACTIVE, ARCHIVED),
      version status (DRAFT ... YANKED), review-task status (PENDING, APPROVED, REJECTED)
      and a `hidden` governance overlay. A single backend projection (headlineVersion,
      publishedVersion, ownerPreviewVersion, resolutionMode) replaced UI code that assembled
      state from four fields. Destructive and reversible actions were separated.
    notable: >-
      Separating "what exists" from "what was reviewed" from "what is served" removed a
      class of contradictory UI states. The host already splits canonical status, content
      trust (approved digest) and served state (catalog basis). The lesson is to keep any
      new state, such as a trial scope, on its own axis and not as a fifth status value. The
      source's code still carries the HIDDEN enum the doc retired, which shows the cost of
      not doing so.
    where:
      - iflytek-skillhub@a463efb5352e:docs/14-skill-lifecycle.md#L8-L25
      - iflytek-skillhub@a463efb5352e:docs/14-skill-lifecycle.md#L60-L73
