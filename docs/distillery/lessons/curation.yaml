  - key: monotonic-immutable-versions
    domains:
      - curation
    layer: content
    what: >-
      Every publish needs a semver version strictly greater than the current latest;
      republishing an existing version is 409. A single-file update endpoint copies the
      latest files, replaces one and publishes with the patch number bumped.
    notable: >-
      Versions are immutable and ordered, so a cached version never changes meaning.
      peripheral for the host, whose versions are Git commits and whose consumers pin
      digests, not semver.
    where:
      - saker-skillhub@6a0a5538257b:pkg/service/skill_service.go#L446-L461
