  - key: suite-pins-exact-members
    domains:
      - curation
      - skill-recommendation
    layer: content
    what: >-
      A Skill Suite is an independently versioned set of references to exact published
      SkillVersions: id, coordinate, version and fingerprint. It copies no files and does
      not re-scan or re-review its members. When members publish new versions, existing
      SuiteVersions do not change. A broken member makes the whole install plan fail rather
      than float to the newest version. A suite's visibility cannot be wider than its
      members'. It names one entry skill.
    notable: >-
      A bundle is a pinned snapshot with an entry point, so it never silently changes
      composition. The trade-off: each member change needs a new suite version. The host's
      collections are a grouping label, and its PRD has relationships (supporting,
      equivalent_to). If the hub ever recommends a set of skills for a task, the
      pin-plus-entry design keeps that set reproducible. Adjacent today.
    where:
      - iflytek-skillhub@a463efb5352e:docs/25-skill-suites.md#L5-L6
      - iflytek-skillhub@a463efb5352e:docs/25-skill-suites.md#L18-L51
