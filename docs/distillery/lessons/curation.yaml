# Lessons whose primary domain is "curation". Written by distill.mjs: edit freely, then run
# `distill.mjs format`. final_score = relevance × impact × evidence / effort (impact = number of
# facts); ranked lessons come first by final_score, then unranked ones by key.
lessons:

  - key: curated-modification-notice
    domains:
      - curation
      - source-learning
      - trust-safety
    layer: content
    what: >-
      Each adapted starter skill ships a NOTICE.md. It names the upstream repository, the
      fixed 40-hex revision, the publisher and the license. It then lists every "SkillHub
      modification" made relative to that revision (removed host-specific invocation,
      treated the input as untrusted, added tie-breaks), ending with "Anthropic does not
      endorse this modified distribution". The builder refuses a NOTICE that lacks the
      repository, commit or license from catalog.json.
    notable: >-
      The difference between curated and upstream is recorded as reasons, not only as a
      diff, and it travels with the skill. The trade-off is hand-written prose that can go
      stale. The host keeps origin repo/path/commit and a modified/diverged digest status,
      and the distill area records lessons. It does not record, per curated skill, why its
      content differs from the upstream base. A 3-way merge then shows a conflict without
      the intent behind the local edit. A short `modifications` list in skill.meta.yaml,
      checked for presence when local status is `modified`, would preserve that intent
      across upstream updates.
    where:
      - iflytek-skillhub@a463efb5352e:builtin-skills/skills/triage-nda/NOTICE.md#L1-L31
      - iflytek-skillhub@a463efb5352e:scripts/build-builtin-skills.py#L221-L225
      - iflytek-skillhub@a463efb5352e:builtin-skills/catalog.json#L1-L12
    contrast: extends
    host: internal/app/upstream_update.go
    score:
      relevance: 3
      facts:
        - a
        - b
      impact: 2
      evidence: 1
      effort: 1
      why: >-
        In scope (curated differs from upstream). a: the host's modified/diverged status
        records that a local edit exists but not why, so a 3-way merge loses the intent
        ("lessons applied without a record of what was incorporated"). b: no host field. One
        source. Rescored 2026-10-13: the confirmed purpose now names collecting, editing and
        tuning curated skills to the human's own criteria.
    final_score: 6
    keywords:
      - NOTICE.md
      - SkillHub modifications
      - fixed revision
      - provenance
    decision: {state: candidate}

  - key: content-completeness-rubric
    domains:
      - curation
    layer: content
    what: >-
      Two rubrics judge a skill's content, not its metadata: a six-axis gap analysis
      (theory→practice, completeness, judgment, verifiability, technology specificity,
      concreteness: "Can the agent actually work with just this?") and an eight-category
      completeness checklist (principles, information needs, process, patterns,
      anti-patterns, verification, tech stack, examples), looping back to research until all
      pass.
    notable: >-
      It names what a usable skill must contain, which the host's readiness check (routing
      fields + not-scaffold) and lint (examples, generic or colliding triggers) never look
      at, so a routing-perfect skill with only theory activates. Trade-off: the axes need
      judgment, so they fit the curator's review guidance or a review prompt, not a hard
      gate. Cheap to adopt as wording in system-skills/curator and docs/curating-skills.md.
    where:
      - skill-forge-mcp@3211174026e6:src/content/phase_3.md#L1-L18
      - skill-forge-mcp@3211174026e6:src/content/phase_5.md#L1-L18
    contrast: new
    host: system-skills/curator/SKILL.md
    score:
      relevance: 3
      facts:
        - a
        - b
      impact: 2
      evidence: 1
      effort: 1
      why: >-
        In scope (curation lifecycle). a: activation accepts a skill that routes well but
        cannot make the agent act; b: neither readiness, lint nor the curator guide covers
        content sufficiency. Not enforceable as a check. One source. Rescored 2026-10-13:
        the confirmed purpose now names collecting, editing and tuning curated skills to the
        human's own criteria.
    final_score: 6
    keywords:
      - gap analysis
      - completeness checklist
      - theory to practice
      - verifiability
    also_fits:
      - skill:system-curator
    decision: {state: candidate}

  - key: already-known-filter-and-cut-order
    domains:
      - curation
      - skill-over-mcp
    layer: wording
    what: >-
      Before writing SKILL.md, every candidate line passes a filter: remove what the model
      already knows, keep what changes default behaviour, project/domain-specific facts, and
      concrete code or tool names. When over budget, cut in a fixed order: rules and
      prohibitions, checklists, decision criteria, patterns, theory, examples last. Writing
      anti-patterns include "too many options → one default + exceptions" and "deep
      reference chains".
    notable: >-
      A per-line keep/remove test plus a priority order makes trimming a skill mechanical
      instead of taste. Trade-off: "does the model already know this" is a judgment that
      varies by model. For the host it is guidance the curator could give when a skill is
      created or edited, and the companion of entrypoint-length-budget-lint (the lint says
      it is too long; this says what to cut).
    where:
      - skill-forge-mcp@3211174026e6:src/content/phase_6.md#L5-L19
      - skill-forge-mcp@3211174026e6:src/content/phase_6.md#L50-L59
      - skill-forge-mcp@3211174026e6:src/content/phase_6.md#L93-L102
    contrast: new
    host: docs/curating-skills.md
    score:
      relevance: 3
      facts:
        - a
        - b
      impact: 2
      evidence: 1
      effort: 1
      why: >-
        In scope (skill content cost). a: skills grow with general knowledge the agent loads
        on every pick; b: curator and curating guide say nothing about what to cut. Prose
        only. One source. Rescored 2026-10-13: the confirmed purpose now names collecting,
        editing and tuning curated skills to the human's own criteria.
    final_score: 6
    keywords:
      - does Claude already know this
      - distillation priority
      - one default + exceptions
    also_fits:
      - skill:system-curator
    decision: {state: candidate}

  - key: prune-proposals-human-approved
    domains:
      - curation
      - skill-recommendation
    layer: content
    what: >-
      `ms prune analyze` finds low-usage (fewer than 5 uses in 30 days), low-quality (<
      0.3), near-duplicate (embedding cosine >= 0.85), toolchain-mismatched and oversized
      skills and emits merge, deprecate and split proposals; `ms prune apply` refuses
      without --approve or --dry-run, and merge/split write drafts instead of editing
      skills.
    notable: >-
      Catalog hygiene becomes a periodic proposal the human reviews, not a manual hunt. The
      trade-off is thresholds that need usage data. The host lints near_duplicate and
      trigger_collision and supports manual deprecation, but never proposes deprecations or
      merges from usage.
    where:
