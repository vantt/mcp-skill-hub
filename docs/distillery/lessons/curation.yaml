  - key: published-numbers-never-reused
    domains:
      - curation
      - storage
    layer: content
    what: >-
      PUBLISHED and YANKED version numbers are permanently occupied. Only DRAFT,
      SCAN_FAILED, UPLOADED and REJECTED can be replaced or deleted, and the last remaining
      version cannot be deleted. A yank (owner or namespace admin, under a row lock) marks
      the version not downloadable. It records yanked_by and the reason, audits
      YANK_SKILL_VERSION and moves the latest pointer to the newest remaining published
      version, or null.
    notable: >-
      Withdrawal without erasure: consumers can still see what was served and why it was
      pulled. The host gets the same properties from Git history, digest-named snapshots and
      the deprecated and archived states. It has no immutable version numbers and needs
      none. Recorded for completeness.
