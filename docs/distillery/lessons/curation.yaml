  - key: owner-trial-before-publish
    domains:
      - curation
      - evaluation
    layer: content
    what: >-
      A PRIVATE upload passes the scan and moves to UPLOADED. In that state only the owner
      can download and install it, the market cannot see it, and it already has a scan
      report. The owner then either confirms publish (no new scan) or submits it for review.
      The same commit made withdrawal return the version to UPLOADED, not DRAFT, so it stays
      testable.
    notable: >-
      Content can be tried in real use by its owner before any audience can see it. The
      trade-off is one more state in the machine. In the host a draft is never offered to
      agents. The only way to try a skill through resolve and serving is to activate it,
      which exposes it to every connected project at once. An owner-only trial scope (for
      example drafts served only in one named project or session) would let the human see
      whether the skill helps before activation. That serves "nobody can tell whether a
      skill change actually helped".
    where:
      - iflytek-skillhub@a463efb5352e:docs/oss-02-core-semantic-rules.md#L61-L72
      - iflytek-skillhub@a463efb5352e:docs/oss-02-core-semantic-rules.md#L86-L124
      - iflytek-skillhub@532d0450aa89
    contrast: new
    host: internal/skill/lifecycle.go
    score:
      relevance: 3
      facts:
        - a
        - b
      impact: 2
      evidence: 1
      effort: 2
      why: >-
        In scope (curation lifecycle, measuring changes). a: lifecycle.go allows only
        draft->active, so trying a skill in agents means activating it for everyone. b: no
        trial scope exists. One source, used in production per the commit. Rescored
        2026-10-13: the confirmed purpose now names collecting, editing and tuning curated
        skills to the human's own criteria.
    final_score: 3
    keywords:
      - UPLOADED
      - confirm-publish
      - private
      - owner preview
      - ownerPreviewVersion
    decision: {state: candidate}

  - key: existing-skill-and-mechanism-check
