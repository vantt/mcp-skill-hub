    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: Adjacent (collections and relationships); no host failure today.
    final_score: 0
    keywords:
      - Skill Suite
      - entry skill
      - pinned members
      - suite.yaml
    decision: {state: candidate}

