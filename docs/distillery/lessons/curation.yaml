  - key: self-reported-progress-ungated
    domains:
      - curation
      - source-learning
    layer: content
    what: >-
      The nine-phase flow is kept on track only by text: a create_skill prompt lists the
      order, mark_progress stores whatever status the agent reports for any phase, the
      manifest's depends_on is never read, and resume_skill tells the agent to call
      get_status and continue from "the next incomplete phase".
    notable: >-
      Progress is what the agent says, not what the files show, so a phase can be marked
      completed with no artefact and out of order, and a crash-free resume still resumes
      from a claim. The host already took the stronger road: lifecycle transitions refuse
      invalid moves (active -> archived), activation refuses scaffold text and missing
      routing fields, skill review derives the next action from file facts
      (computeNextAction), and distill's seal refuses to move a cursor until every where and
      coverage stamp verifies. Recorded as independent evidence that advisory-only phases
      are the weak form; nothing to port.
    where:
      - skill-forge-mcp@3211174026e6:src/index.ts#L214-L263
      - skill-forge-mcp@3211174026e6:src/index.ts#L308-L374
