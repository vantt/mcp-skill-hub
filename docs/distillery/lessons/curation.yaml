  - key: yank-excludes-from-latest
    domains:
      - curation
    layer: content
    what: >-
      Two version withdrawals with npm/PyPI semantics: yank excludes a version from "latest"
      and repoints latest to the newest non-yanked version, deprecate only attaches a
      message. The model comment says a yanked version stays installable by exact pin, but
      the runtime API answers 410 Gone for any yanked version, pinned or not.
    notable: >-
      Separating "stop recommending" from "stop serving" protects pinned consumers.
      peripheral for the host: it serves one current version per skill and pins generations,
      not semver ranges. The comment-vs-handler contradiction is another case of a promise
      no test checks.
    where:
      - saker-skillhub@6a0a5538257b:pkg/service/skill_yank.go#L13-L39
      - saker-skillhub@6a0a5538257b:pkg/service/skill_yank.go#L119-L132
