  - key: staged-locked-install-with-rollback
    domains:
      - curation
      - host-integration
    layer: content
    what: >-
      The CLI installs in steps. It downloads (capped at 100 MB) and extracts to a temp dir
      with zip-entry path checks, then verifies the fingerprint. It takes per-target locks
      (proper-lockfile plus a bakery queue in a private 0700 temp dir) and renames any
      existing dir to a backup. It checks ownership of what it replaces ("cannot verify
      SkillHub ownership", "source conflict"), commits and records the inventory under its
      own lock. On failure it restores the backup.
    notable: >-
      A multi-target install is all-or-nothing and never replaces a folder it does not own.
      The host's mutation transaction (stage, atomic replace, recovery, receipt) and its
      no-overwrite rule for connect files cover the same ground. Recorded as convergence.
    where:
