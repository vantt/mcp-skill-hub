lessons:

  - key: stubs-removed-not-shipped
    domains:
      - storage
      - ux
    layer: history
    what: >-
      meta_skill deleted registry and updater modules that were stubs always returning
      Ok(None) or NotImplemented, and an evidence store that is written as "{}" with no
      production caller is still present.
    notable: >-
      A stub that looks like a feature misleads users and agents. The host's disabled vector
      and LLM channels fail loudly in Validate() instead.
    where:
      - meta-skill@2b333b54b71c
    contrast: already-covered
    host: internal/resolver/policy.go
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 1
