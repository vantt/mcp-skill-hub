  - key: two-phase-commit-git-sqlite
    domains:
      - storage
    layer: content
    what: >-
      Every meta_skill write runs four phases: a tx record, SQLite pending, a Git commit,
      SQLite committed; incomplete tx_log rows are replayed on startup under a global lock.
    notable: >-
      saker writes files to the store first and the version rows in one DB transaction
      after; if the transaction fails for any reason except a conflict or validation error,
      it deletes the just-written version as a compensating step (logging, not failing, if
      that cleanup fails). A lighter pattern than a transaction log, which leaves orphans
      when the process dies between the two writes.
    where:
      - meta-skill@e999668e8d8c:src/storage/tx.rs#L1-L5
      - meta-skill@e999668e8d8c:src/storage/tx.rs#L499-L522
      - saker-skillhub@6a0a5538257b:pkg/service/skill_service.go#L575-L622
    contrast: already-covered
    host: internal/mutation/transaction.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered by the host's WAL; relevant to plan open decision 1.
    decision: {state: candidate}
