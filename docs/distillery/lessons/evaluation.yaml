  - key: behavior-eval-per-curated-skill
    domains:
      - evaluation
      - curation
    layer: validation
    what: >-
      The reviewed starter collection requires one evals.json case per skill. Each case has
      a realistic prompt, `acceptance` criteria and `forbidden` behaviours. The builder
      fails on "eval inventory mismatch" when a skill has no case or a case has no skill.
    notable: >-
      Every curated skill carries a statement of what correct and unsafe behaviour look
      like, and CI enforces that it exists. Running the cases still needs a model or a
      human. The host evaluates routing (examples, counter_examples, no-skill cases), not
      what the skill makes the agent do. An edit to a skill's body has no recorded
      acceptance or forbidden behaviour to check against. A required behaviour case per
      active skill, checked for presence by `skill lint`, would give "did this change help"
      a baseline. The `forbidden` list is also a natural place for third-party safety
      concerns found in review.
    where:
      - iflytek-skillhub@a463efb5352e:scripts/build-builtin-skills.py#L119-L148
      - iflytek-skillhub@a463efb5352e:builtin-skills/evals.json#L1-L40
      - iflytek-skillhub@a463efb5352e:builtin-skills/README.md#L48-L52
    contrast: extends
    host: internal/evaluation
    score:
      relevance: 3
      facts:
        - a
        - b
        - d
      impact: 3
      evidence: 1
      effort: 2
      why: >-
        In scope (feedback that proves changes help). a: a content edit to an active skill
        has no behavioural check, only routing evals. b: the host eval suite covers
        resolution, not behaviour. d: presence is lintable. One source. Rescored 2026-10-13:
        the confirmed purpose now names collecting, editing and tuning curated skills to the
        human's own criteria.
    final_score: 4.5
    keywords:
      - evals.json
      - acceptance
      - forbidden
      - regression case
      - starter collection
    decision: {state: candidate}

  - key: per-file-navigation-signals
    domains:
      - evaluation
      - curation
    layer: validation
    what: >-
      Every resource read is appended to an access log (uri, phase, section) and get_status
      reports reads per phase. Phase 8 turns navigation into curation actions: files read in
      an unexpected order → fix links; important references never followed → make links
      explicit; a section read repeatedly → move it into the SKILL.md body; a bundled file
      never read → consider removing it.
    notable: >-
      Which files of a skill the agent actually opens is a content-free, cheap signal that
      maps directly to an edit (promote, link, or delete a file). Trade-off: reads without
      outcomes say nothing about quality, and the source only counts phases, not the four
      patterns. The host records skill loads with a resource kind
      (entrypoint/reference/script/asset) but not which file, so it cannot tell a curator
      that references/x.md was never read in N loads.
    where:
      - skill-forge-mcp@3211174026e6:src/index.ts#L60-L65
      - skill-forge-mcp@3211174026e6:src/index.ts#L272-L304
      - skill-forge-mcp@3211174026e6:src/content/phase_8.md#L48-L57
    contrast: extends
    host: internal/delivery/mcpserver/load_attribution.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - d
      impact: 3
      evidence: 1
      effort: 2
      why: >-
        In scope (telemetry that makes skills measurably better). a: unused bundled files
        and over-read references stay invisible, so curation cannot act on them; b:
        mapResourceKind drops the path; d: lands as a telemetry field and a funnel/review
        line. One source, only partly implemented there. Rescored 2026-10-13: the confirmed
        purpose now names collecting, editing and tuning curated skills to the human's own
        criteria.
    final_score: 4.5
    keywords:
      - access log
      - reads
      - unused content
      - over-reliance
      - missed references
    decision: {state: candidate}

  - key: graded-implicit-rewards
    domains:
      - evaluation
      - skill-recommendation
    layer: content
    what: >-
      meta_skill turns usage into graded rewards for its suggestion bandit: explicit helpful
      1.0, used over five minutes 0.8, loaded only 0.3, ignored 0.1, unloaded quickly or not
      helpful 0.0, star ratings scaled, task completion 0.7-0.9.
    notable: >-
      It gets a learning signal without asking the user every time, at the price of treating
      dwell time as usefulness. The host deliberately refuses this: outcome_record "never
      infers usefulness from activation or use". Recorded as a contradiction for the human
      to weigh, not as a gap. In the source the rewards update a bandit with empty context,
      so they cannot learn which context a skill helped in.
    where:
      - meta-skill@e999668e8d8c:src/suggestions/bandit/rewards.rs#L94-L130
    contrast: contradicts
    host: internal/delivery/mcpserver/insight_tools.go
    score:
      relevance: 2
      facts:
        - a
        - b
      impact: 2
      evidence: 1
      effort: 2
      why: >-
        In scope (evaluation). a: explicit outcomes are rare, so the host often cannot tell
        whether a skill helped; b: no implicit signal by design. Contradicts a deliberate
        host choice; one source.
    final_score: 2
    decision: {state: candidate}

  - key: ab-experiment-on-skill-variants
    domains:
      - evaluation
      - curation
    layer: validation
    what: >-
      `ms experiment` assigns skill or slice variants (uniform, weighted or Thompson
      sampling), records task_success outcomes per variant, and reports a two-proportion
      z-test; "appears better" only at p <= 0.05, otherwise "No significant difference yet".
      Conclude records the winner without applying it.
    notable: >-
      It measures whether a skill change helped instead of assuming it, and keeps the human
      in charge (no auto-apply). The trade-off: it needs enough outcomes per variant, which
      a personal hub may never reach. The host compares routing variants but has no utility
      experiment for a curated skill edit (doc 04 §8.4 designed, not built).
    where:
      - meta-skill@e999668e8d8c:src/cli/commands/experiment.rs#L1003-L1050
    contrast: new
    host: docs/design/04-telemetry-reproducibility-evaluation.md
    score:
      relevance: 2
      facts:
        - a
        - b
        - e
      impact: 3
      evidence: 1
      effort: 3
      why: >-
        In scope (feedback that proves improvement). a: a curated skill edit ships with no
        measure of whether it helped; b: no skill-level experiment exists; e: the failure is
        silent. One source, and a new subsystem.
    final_score: 2
    decision: {state: candidate}

  - key: ownership-sentinel-tests
    domains:
      - evaluation
      - curation
    layer: validation
    what: >-
      The CLI upgrade work was landed with tests named for invariants: "prove upgrade safety
      invariants", "prove manual ownership remains untouched", "bind ownership sentinels to
      each fixture", "use a dead pid for stale lock recovery". The tests run against a fake
      registry (Bun.serve) with injectable failure modes (auth, forbidden, not_found,
      rate_limited, server_error, network) in a temp HOME and CWD.
    notable: >-
      Safety claims ("never touches files you own") are proven by planting sentinel files in
      each fixture and asserting they survive. The host's connect and upstream update make
      the same claims. Whether every fixture carries such a sentinel was not checked, so
      this is recorded as extends at low weight.
