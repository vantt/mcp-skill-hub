      - zouyingcao-agentskills@32589389aacf:README.md#L214-L218
      - zouyingcao-agentskills@32589389aacf:docs/tools.md#L29-L38
      - zouyingcao-agentskills@32589389aacf:README.md#L94-L103
      - iflytek-skillhub@a463efb5352e:docs/14-skill-lifecycle.md#L1-L6
