        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/skill/service/SkillGovernanceService.java#L249-L257
      - iflytek-skillhub@a463efb5352e:docs/07-skill-protocol.md#L116-L121
      - >-
        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/skill/validation/SkillPackagePolicy.java#L18-L20
      - saker-skillhub@6a0a5538257b:README.md#L18-L18
      - saker-skillhub@6a0a5538257b:pkg/gitstore/importer.go#L18-L25
      - saker-skillhub@6a0a5538257b:pkg/gitstore/importer.go#L157-L160
