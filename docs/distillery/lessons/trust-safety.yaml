    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        In scope (human approval of third-party content); the host already approves per
        content digest.
    keywords:
      - moderation
      - pending_review
      - ModerationStatus
      - approved
    decision: {state: candidate}

  - key: archive-extraction-hardening
    domains:
      - trust-safety
      - skill-sources
    layer: enforcement
    what: >-
      Tarball and zip extraction normalise every member name to a POSIX relative path and
      reject absolute paths, `..`, and any part containing ":" (Windows drives, UNC), reject
      symlinks and hard links, re-confine each target with resolve_inside, skip .git, .env,
      node_modules and dotfiles, and cap 25 MB per file, 200 MB download, 100 MB extracted
      (zip: 1,000 files). The fix commit added tests for UNC paths, drive prefixes and
      traversal.
    notable: >-
      Every upstream archive is untrusted input; dropping .env on import also keeps an
      upstream's secrets out of the library. The host reads upstreams through go-git mirrors
      with a byte budget, mirror-size check and no-follow file access, so the archive form
      of this attack does not reach it; recorded as agreement.
    where:
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/skills/internal/github.py#L174-L192
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/skills/internal/github.py#L262-L297
      - skillport@192d4483400d
    contrast: already-covered
    host: internal/source/git_repository.go
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered by the mirror byte budget and no-follow reads.
    keywords:
      - tarball
      - zip slip
      - symlink
      - resolve_inside
    decision: {state: candidate}

  - key: bundled-skills-pinned-by-sha
    domains:
      - trust-safety
      - host-integration
    layer: enforcement
    what: >-
      The official starter skills are built deterministically. The build runs twice and
      `cmp` checks the zips and artifacts.json, which must have sorted entries and contain
      SKILL.md, LICENSE.txt and NOTICE.md. The runtime manifest pins each package to an
      https URL on one CDN host with a SHA-256 that must equal the built artifact. The
      backend rejects changed bytes before extraction. A negative test plants a symlink to
      /etc/passwd and expects "symbolic links are not allowed".
    notable: >-
      What a fresh deployment installs by default is reproducible and integrity-checked
      against the reviewed source. The host embeds its system skills and checks them against
      known digests. Recorded as convergence.
    where:
      - iflytek-skillhub@a463efb5352e:scripts/tests/build-builtin-skills-test.sh#L101-L156
      - iflytek-skillhub@a463efb5352e:scripts/tests/build-builtin-skills-test.sh#L173-L195
      - iflytek-skillhub@a463efb5352e:builtin-skills/README.md#L21-L31
    contrast: already-covered
    host: internal/systemskills/known-digests.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered by embedded system skills with known digests.
    keywords:
      - deterministic zip
      - runtime manifest
      - sha256
      - immutable CDN
    decision: {state: candidate}

  - key: git-token-in-argv
    domains:
      - trust-safety
      - skill-sources
    layer: craft
    what: >-
      Mirror push passes the token inside `git -c credential.helper=!f(){ ...
      password=<token>; }; f`, with a comment saying this avoids leaking the token in
      /proc/*/cmdline; the -c argument is itself on the command line.
    notable: >-
      A security comment that claims the opposite of what the code does. The host never
      handles Git credentials: it refuses remote URLs with a user name or password and lets
      Git ask or use the user's own credential helper.
    where:
      - saker-skillhub@6a0a5538257b:pkg/gitstore/mirror.go#L51-L79
    contrast: already-covered
    host: internal/app/git_remote.go
    score:
