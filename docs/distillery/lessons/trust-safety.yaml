    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered by the review gate on third-party content.
    keywords:
      - add
      - no review
      - third-party
    decision: {state: candidate}

  - key: approval-bound-to-skill-not-version
    domains:
      - trust-safety
      - curation
    layer: content
    what: >-
      A non-admin publishing a new public skill gets visibility private and moderation
      pending_review until a moderator approves. The check runs only in the "skill does not
      exist yet" branch; every later version of an approved public skill is published and
      served with no review.
    notable: >-
      Approval is attached to the name, not to the bytes, so the first benign version buys
      unreviewed publication of every later one. The host binds approval to a content digest
      per version (review_required until the digest is approved). This independent registry
      made the opposite choice, which confirms the host's design and names the failure it
      avoids.
    where:
      - saker-skillhub@6a0a5538257b:pkg/service/skill_service.go#L405-L411
      - saker-skillhub@6a0a5538257b:pkg/service/skill_service.go#L436-L444
    contrast: already-covered
