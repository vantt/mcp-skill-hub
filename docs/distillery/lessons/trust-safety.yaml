# Lessons whose primary domain is "trust-safety". Written by distill.mjs: edit freely, then run
# `distill.mjs format`. final_score = relevance × impact × evidence / effort (impact = number of
# facts); ranked lessons come first by final_score, then unranked ones by key.
lessons:

  - key: content-scan-before-review
    domains:
      - trust-safety
      - curation
    layer: enforcement
    what: >-
      meta_skill scans untrusted skill content for prompt-injection phrases ("ignore
      previous instructions", "exfiltrate", "reveal system prompt") and secrets (AWS keys,
      GitHub tokens, private keys...), quarantines hits with a replay command, and its lint
      rules no-secrets and no-injection are errors that block indexing. tech-leads-club
      independently gates every release on an agent-security scan of each skill, failing on
      critical or high findings, with an allowlist whose entries carry reason, approver and
      an expiry.
    notable: >-
      The human reviewer gets machine-flagged risks instead of reading every line. The
      regexes are simple keyword matches, so this is a net for obvious cases, not a defence.
      The host gates third-party content on a human-approved digest but runs no scan to help
      that review. A third independent source runs a scanner (static, behavioral and
      optional LLM analyzers) after upload and before the human review queue. Verdicts are
      SAFE, SUSPICIOUS, DANGEROUS and BLOCKED. Approval is blocked while scanning, and regex
      secret rules produce warnings the publisher must confirm. Same placement as
      meta_skill: the machine flags, the human decides.
    where:
      - meta-skill@e999668e8d8c:src/security/acip.rs#L13-L45
      - meta-skill@e999668e8d8c:src/lint/rules/security.rs#L400-L440
      - tech-leads-club@120b67676388:packages/skills-catalog/src/scan-skills.ts#L361-L385
      - >-
        tech-leads-club@120b67676388:packages/skills-catalog/security-scan-allowlist.yaml#L1-L19
      - >-
        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/security/SecurityScanService.java#L173-L209
      - >-
        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/skill/validation/BasicPrePublishValidator.java#L20-L34
      - iflytek-skillhub@a463efb5352e:docs/security-scanning.md#L9-L22
    contrast: extends
    host: internal/skillruntime/trust.go
    score:
      relevance: 2
      facts:
        - a
        - b
        - d
        - e
      impact: 4
      evidence: 3
      effort: 2
      why: >-
        In scope (human approval of third-party content). a: a reviewer can approve a skill
        with an injected instruction or a secret because nothing flags it; b: no scan
        exists; d: lands as a lint/check; e: the failure is silent. Two independent sources
        converge.
    final_score: 12
    decision: {state: candidate}

  - key: scan-gate-fails-closed
    domains:
      - trust-safety
      - curation
    layer: enforcement
    what: >-
      Publishing a PUBLIC or NAMESPACE_ONLY version is refused with
      `error.security.scanner.required` when the scanner is disabled. Approval is refused
      with `review.approve.scan_in_progress` while the version is SCANNING. After retries
      run out a scan ends in SCAN_FAILED, but a review task is still created "so the package
      does not get stuck forever". The policy states "Scanner failure must not be treated as
      proof that a package is safe."
    notable: >-
      The gate fails closed for anything shared, yet a broken scanner cannot deadlock the
      human queue: the reviewer sees the failure and decides. The trade-off: a scanner
      outage blocks publishing. For the host this matters only once a content scan exists
      (see content-scan-before-review). It then defines the rule that a missing or failed
      scan blocks activation of third-party content unless the human approves with the
      failure shown, never silently.
    where:
      - >-
        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/skill/service/SkillPublishService.java#L465-L467
      - >-
        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/review/ReviewService.java#L194-L198
      - iflytek-skillhub@a463efb5352e:docs/security-scanning.md#L165-L175
      - iflytek-skillhub@a463efb5352e:docs/CONTENT_SAFETY.md#L97-L100
    contrast: new
    host: internal/skillruntime/trust.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        In scope (approval of third-party content). b: the host has no scan, so it has no
        rule for scan absence or failure. d: it is a gate. Impact is 0 by rule until the
        host has a scan. One source. Facts b/d would hold once the host has a concrete
        failure (fact a).
    final_score: 0
    keywords:
      - SCANNING
      - SCAN_FAILED
      - scanner required
      - fail closed
    decision: {state: candidate}

