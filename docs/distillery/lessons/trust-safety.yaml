  - key: closed-allowlist-exec-surface-validation
    domains:
      - trust-safety
    layer: enforcement
    what: >-
      Before accepting an Agent Plugins package, saker validates mcp.json with closed field
      sets per transport: stdio command must be one bare or ./-relative token, cwd only
      under ./, ${PLUGIN_ROOT} or ${PLUGIN_DATA}, reserved env names refused; http(s)
      servers must use HTTPS unless loopback, no userinfo or fragment, headers checked with
      httpguts and deduplicated; package paths must be canonical and local.
    notable: >-
      The registry rejects an executable surface it cannot reason about instead of trusting
      the author, using allow-lists rather than deny-lists. For the host this applies to
      skills that declare runtime commands or env (preflight/setup): an allow-list check at
      import would refuse absolute-path commands or credential-bearing URLs before a human
      even reviews them. This pass did not verify which fields the host's runtime spec
      already closes.
    where:
      - saker-skillhub@6a0a5538257b:pkg/agentplugin/validate.go#L60-L70
      - saker-skillhub@6a0a5538257b:pkg/agentplugin/validate.go#L170-L261
    contrast: new
    host: internal/skillruntime
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: >-
        Adjacent (what may run); host does not distribute MCP server configs, and no host
        failure was verified.
    final_score: 0
    keywords:
      - mcp.json
      - stdio
      - streamable-http
      - PLUGIN_ROOT
      - agent plugins
      - validateServer
    decision: {state: candidate}

