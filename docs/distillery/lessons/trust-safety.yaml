  - key: privileged-path-skipped-scan
    domains:
      - trust-safety
      - curation
    layer: history
    what: >-
      The super-admin auto-publish flow skipped security scanning entirely (issue #415). The
      fix calls triggerScan regardless of autoPublish, "while preserving the PUBLISHED
      status (scan runs as post-publish audit rather than blocking)". Today
      SecurityScanService leaves an already-PUBLISHED version in place and only records the
      audit.
    notable: >-
      A privileged shortcut is where a gate silently disappears, and the fix kept the
      shortcut and demoted the gate to an after-the-fact audit. The host avoids this
      structurally. Its trust check runs where the catalog decides what is servable, not on
      each write path, and `--approve-content` must name the exact content digest. It is
      recorded as independent confirmation that the gate belongs at the serving boundary.
    where:
      - iflytek-skillhub@ec4598efec82
      - >-
        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/security/SecurityScanService.java#L133-L137
