  - key: scoped-expiring-tokens
    domains:
      - trust-safety
      - host-integration
    layer: content
    what: >-
      API tokens carry a scope: read (GET/HEAD only), publish (POST only on the publish and
      star routes), full. Namespace team tokens must have an expiry (at most 365 days) and a
      namespace may hold at most 50 active ones.
    notable: >-
      Least privilege per credential, and no team credential lives forever. The host's
      network MCP uses one shared, non-expiring bearer token, and keeps privilege low by
      exposing only the runtime tools there (no curation tools). Expiry or rotation of that
      token is the part the host does not have.
    where:
      - saker-skillhub@6a0a5538257b:pkg/middleware/auth.go#L96-L136
      - saker-skillhub@6a0a5538257b:pkg/handler/token_handler.go#L27-L45
      - saker-skillhub@6a0a5538257b:pkg/handler/token_handler.go#L241-L258
    contrast: extends
    host: internal/hubtoken/hubtoken.go
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: >-
        Adjacent (remote access); host already limits the network surface to read-only
        tools.
    final_score: 0
    keywords:
      - token scope
      - read
      - publish
      - team token
      - expiresIn
    decision: {state: candidate}

  - key: verifier-interface-records-unverified
    domains:
      - trust-safety
    layer: content
    what: >-
      Publish accepts an optional Sigstore bundle; a pluggable SignatureVerifier decides,
      and the default NopVerifier only checks it is JSON and returns "unverified". Only
      "invalid" is rejected; the status (unsigned, unverified, verified, invalid) plus
      subject and issuer are stored per version and returned to clients.
    notable: >-
      Shipping the upload path and the status field before the verification infrastructure
      lets clients start showing trust state, at the cost that "has a signature" can be
      mistaken for "verified". The host plans signing "when infrastructure allows";
      recording a verification status per version is the cheap first step, but the host's
      trust gate is human approval of a digest, not signatures.
    where:
      - saker-skillhub@6a0a5538257b:pkg/security/sigstore.go#L1-L61
      - saker-skillhub@6a0a5538257b:pkg/service/skill_service.go#L525-L552
      - saker-skillhub@9932f7933aab
    contrast: contradicts
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: >-
        Adjacent; the host does not distribute signed packages, and accepting unverified
        bundles contradicts refuse-unsigned designs.
    final_score: 0
    keywords:
      - sigstore
      - SignatureVerifier
      - NopVerifier
      - unverified
      - cosign
    decision: {state: candidate}

  - key: async-scan-latest-attempt-wins
    domains:
      - trust-safety
      - storage
    layer: craft
    what: >-
      Each scan attempt gets its own security_audit row. A late result is stored on its own
      round but "cannot complete a newer attempt": only the latest active attempt moves the
      version out of SCANNING. Scan tasks are written to an outbox, because publishing them
      before the transaction committed lost tasks (issue #612). Unavailable tasks expire to
      SCAN_FAILED after max-unavailable-age.
    notable: >-
      Asynchronous checks need attempt identity and after-commit delivery, or a stale or
      lost result decides the state. The host runs everything synchronously in one process,
      so this applies only if a scan or remote check ever runs out of band. Recorded at low
      relevance.
    where:
      - >-
        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/security/SecurityScanService.java#L125-L137
      - >-
        iflytek-skillhub@a463efb5352e:server/skillhub-domain/src/main/java/com/iflytek/skillhub/domain/security/SecurityScanService.java#L195-L209
      - iflytek-skillhub@95e630c09674
      - iflytek-skillhub@51457bfa2c1a
    contrast: new
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 2
      effort: 2
      why: Adjacent; the host has no asynchronous checks. Fixed in practice per two commits.
    final_score: 0
    keywords:
      - outbox
      - scan attempt
      - late result
      - after commit
    decision: {state: candidate}

  - key: scan-verdict-not-safety-claim
    domains:
      - trust-safety
      - ux
    layer: wording
    what: >-
      The `isSafe: true` verdict is rendered as "No high-risk findings", not as safe. Lower
      severity findings may still be present and findingsCount may be non-zero. The policy
      adds that controls "reduce risk but do not certify a package as safe or compliant".
    notable: >-
      A scan label that reads as a guarantee invites the human to skip review. The commit
      shows the wording was changed deliberately. If the host adds scan hints to `skill
      review` or the web UI, the label should name what was checked ("no high-risk patterns
      found"), not a verdict ("safe"). The same applies to the host's current advisory
      runtime hints.
    where:
      - iflytek-skillhub@a463efb5352e:docs/security-scanning.md#L161-L163
      - iflytek-skillhub@9bbadca31b2b
      - iflytek-skillhub@a463efb5352e:docs/CONTENT_SAFETY.md#L80-L95
    contrast: new
    host: internal/app/skill_review.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        In scope (human approval). b: no host wording rule for scan or hint labels. No
        current host failure. One source. Facts b would hold once the host has a concrete
        failure (fact a).
    final_score: 0
    keywords:
      - isSafe
      - No high-risk findings
      - verdict
      - certify
    decision: {state: candidate}

  - key: add-serves-without-review
    domains:
      - trust-safety
      - curation
    layer: content
    what: >-
      `skillport add <github-url>` validates frontmatter (fatal issues only) and copies the
      skills into the served directory; the next MCP start indexes them and search can
      return them to any agent. There is no draft state, review or approval step, and
      `update --all` replaces content from upstream on the same terms.
    notable: >-
      Fast onboarding for a single user, at the cost of serving third-party instructions and
      scripts nobody has read. The host's goal names exactly this failure, and its
      third-party skills reach agents only after `skillhub skill review` approves a digest;
      recorded as the contrast that justifies that gate.
    where:
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/skills/public/add.py#L401-L495
      - skillport@51334ae94919:README.md#L46-L65
