# Lessons whose primary domain is "skill-over-mcp". Written by distill.mjs: edit freely, then run
# `distill.mjs format`. final_score = relevance × impact × evidence / effort (impact = number of
# facts); ranked lessons come first by final_score, then unranked ones by key.
lessons:

  - key: tools-list-is-a-fixed-cost
    domains:
      - skill-over-mcp
      - host-integration
    layer: history
    what: >-
      tech-leads-club treats tool descriptions as a fixed context cost "the client loads
      into context every session, whether or not any tool is called": it cut them from 719
      to 385 tokens (tools/list 1505 → 1173) keeping only trigger, input shape and follow-up
      call, and checked that search quality did not move (1 of 10 real queries empty, 0 of 5
      unanswerable ones leaking).
    notable: >-
      The cost of an MCP server to every agent is its tools/list, not only the skills it
      serves. Re-measured on this host 2026-10-13 (TestToolsListSize): all tools 118 KB (76%
      outputSchema); the runtime profile that `connect` installs is 3 tools and 16.6 KB
      (~4.2k tokens), 61% of it outputSchema, and the test asserts only the tool count, not
      a byte budget. skillport, independently, serves skills with 2 tools whose descriptions
      total ~830 characters and whose results are untyped dicts, a few KB in all; the
      remaining host gap is output schemas and the resolve input schema, not tool count.
    where:
      - tech-leads-club@85dd32647899
      - tech-leads-club@120b67676388:packages/mcp/src/tools/search-tool.ts#L7-L10
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/interfaces/mcp/tools.py#L23-L75
    contrast: new
    host: internal/delivery/mcpserver/server.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - c
        - d
        - e
      impact: 5
      evidence: 3
      effort: 2
      why: >-
        Core. a: runtime tools/list still 16.6 KB per session; b: no byte budget asserted;
        c: every session; d: a size-budget assertion in tools_size_test.go; e: silent, and
        tech-leads-club measured its own cut. Evidence 3: tech-leads-club and skillport
        reached a minimal-description runtime surface independently.
    final_score: 22.5
    decision: {state: candidate}

  - key: entrypoint-length-budget-lint
    domains:
      - skill-over-mcp
      - curation
    layer: content
    what: >-
      The guide sets a hard budget for the loaded body: SKILL.md under 500 lines / ~5000
      tokens (L2), name+description ~100 tokens (L1), resources loaded only when referenced
      and only one reference level deep from SKILL.md; Phase 7 repeats these as the
      deploy-time validation checklist and Phase 6 gives an order for what to cut when over
      budget.
    notable: >-
      The context cost of a skill is set at authoring time by how long its entrypoint is,
      because a client loads SKILL.md whole. The source keeps the rule as prose for the
      agent; the transferable mechanism is to make it a lint/readiness warning (entrypoint
      lines or estimated tokens over a threshold; a reference file that links to another
      reference). Trade-off: a threshold is a heuristic and some reference skills
      legitimately run long, so it should warn, not refuse. For this host,
      ValidateServableSkill only checks name, description and the 16 MiB / 512-resource
      ceilings, so a 3,000-line SKILL.md activates and is loaded whole on every pick.
    where:
      - skill-forge-mcp@3211174026e6:src/content/phase_0.md#L51-L59
      - skill-forge-mcp@3211174026e6:src/content/phase_6.md#L41-L59
      - skill-forge-mcp@3211174026e6:src/content/phase_7.md#L39-L51
    contrast: new
    host: internal/catalog/servable.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - c
        - d
      impact: 4
      evidence: 1
      effort: 1
      why: >-
        Core (load only what the task needs). a: the host activates and serves an entrypoint
        of any length and the agent loads it whole (failure "loads too much content"); b: no
        length or reference-depth rule in servable.go, lint.go or checkActivationReadiness;
        c: applies to every skill load; d: lands as a lint finding / readiness warning. One
        source (a guide, not measured).
    final_score: 12
    keywords:
      - 500 lines
      - 5000 tokens
      - progressive disclosure
      - one level deep
      - L1 L2 L3
    also_fits:
      - skill:system-curator
    decision: {state: candidate}

  - key: listing-frontmatter-verbatim
    domains:
      - skill-over-mcp
    layer: content
    what: >-
      The skills extension requires the listing's frontmatter to be identical in content to
      the SKILL.md it describes, and requires hosts to parse the fetched SKILL.md and
      compare it field by field; any discrepancy is a verification failure and the skill
      must not be loaded.
    notable: >-
      What the user approves from the listing is then exactly what the model receives. The
      host serves its bundled system-curator with frontmatter it adds at serve time
      (activation-policy, coordination-boundary, compatible-tools, instruction-only,
      best-effort-coordination, requires-application-service) that are not in that SKILL.md,
      so a conforming client must refuse to load it. Fix by putting those fields in the
      SKILL.md itself or in _meta.
    where:
      - ext-skills@167da6c0d42c:specification/stable/skills.mdx#L200-L206
      - ext-skills@167da6c0d42c:specification/stable/skills.mdx#L461-L466
    contrast: contradicts
    host: internal/systemskills/curator/SKILL.md
    score:
      relevance: 3
      facts:
        - a
        - b
        - d
        - e
      impact: 4
      evidence: 1
      effort: 1
      why: >-
        Core of the goal (serving skills over MCP). a: distribution.go:506-514 adds fields
        the curator SKILL.md does not have, so a conforming client must refuse it; b:
        nothing checks listing against file; d: a conformance test catches it; e: it fails
        only on strict clients, silently today. Normative spec, one source; a small change.
    final_score: 12
    decision:
      state: ported
      reason: >-
        fixed on the human's instruction: the contract moved into SKILL.md and is served
        verbatim, with a test that listing equals file
      at: 167da6c0d42c
      local: curator compatibility frontmatter

  - key: token-budget-disclosure-levels
    domains:
      - skill-over-mcp
      - skill-recommendation
    layer: content
    what: >-
      meta_skill loads a skill at a disclosure level with a token budget: Minimal ~100,
      Overview ~500, Standard ~1500, Full, Complete (with scripts and references). `--pack
      <tokens>` packs typed slices (rule, command, example, pitfall, policy...) under the
      budget with coverage quotas, task presets (debug, refactor, learn...), and policy
      slices that are never dropped.
    notable: >-
      Context cost becomes a parameter the server enforces instead of a property of how long
      the author wrote SKILL.md. Two designs now: meta_skill packs typed slices under a
      token budget (needs a slice schema in every skill); skill-forge-mcp serves a single
      section through a resource template whose name→heading index lives in a manifest, with
      "overview" = text before the first ### and a batch template for several at once. The
      section form costs no new skill format (headings already exist) but drifts silently: a
      renamed heading is only found when a request fails with an internal error, so a host
      adopting it should derive the section index from the file at build time instead of a
      hand-kept manifest. The host discloses by file and always serves a whole SKILL.md.
    where:
      - meta-skill@e999668e8d8c:src/core/disclosure.rs#L20-L50
      - meta-skill@e999668e8d8c:src/core/packing.rs#L10-L50
      - skill-forge-mcp@3211174026e6:src/index.ts#L81-L162
      - skill-forge-mcp@3211174026e6:src/content.ts#L31-L83
      - skill-forge-mcp@3211174026e6:src/content/manifest.json#L12-L30
    contrast: extends
    host: internal/delivery/mcpserver/server.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - c
        - d
      impact: 4
      evidence: 2
      effort: 3
      why: >-
        Core of the goal. a: a long SKILL.md is loaded whole even when a section suffices;
        b: no sub-file disclosure; c: every skill load; d: the server can serve and enforce
        it. Evidence 2: a second independent source reached sub-file disclosure. Effort 2
        for the heading-section form (no new skill format), 3 for slice packing.
    final_score: 8
    decision: {state: candidate}

  - key: server-instructions-carry-the-protocol
    domains:
      - skill-over-mcp
      - host-integration
    layer: content
    what: >-
      skillport sends its usage protocol in the MCP server `instructions` field
      (<skills_system>: workflow search -> load -> read, tool list, tips such as "execute
      scripts via path, don't read them into context"), built at startup from the list of
      tools actually registered for the transport, and appends always-on core skills. Tests
      assert the instructions mention read_skill_file only when that tool exists.
    notable: >-
      The protocol travels with the server, so connecting the MCP server is the whole
      install: no per-project instruction file, and the text can never disagree with the
      running binary's tools. The host does the opposite: mcp.ServerOptions carries no
      Instructions, and `connect` writes a versioned bootstrap block (~3 KB) into CLAUDE.md
      / AGENTS.md / GEMINI.md, which `doctor --fix` must refresh when it goes stale; in this
      very session the same block is loaded twice, from ~/.claude/CLAUDE.md and from the
      project CLAUDE.md. Trade-offs: some clients ignore or truncate server instructions
      (the host's file block works without client support), and a user cannot tune server
      instructions per project. For the selling point "nothing to install per project",
      server instructions are the zero-file channel; a sensible shape is both, with the file
      block reduced to a pointer.
    where:
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/interfaces/mcp/instructions.py#L17-L91
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/interfaces/mcp/server.py#L34-L69
      - skillport@51334ae94919:tests/unit/test_transport_mode.py#L29-L90
    contrast: new
    host: internal/delivery/mcpserver/server.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - c
        - d
      impact: 4
      evidence: 1
      effort: 2
      why: >-
        Core (skills over MCP with nothing installed per project). a: the host's protocol
        lives only in per-project/global instruction files that drift and need doctor --fix,
        and here loads twice; b: server.go sets no Instructions; c: every connected project
        and session; d: generated from the tool registry and asserted by a test. One source;
        a new channel plus trimming the bootstrap block.
    final_score: 6
    keywords:
      - instructions
      - skills_system
      - server instructions
      - bootstrap
    decision: {state: candidate}

  - key: stable-skill-uri-for-recovery
    domains:
      - skill-over-mcp
    layer: content
    what: >-
      When a read fails verification because a skill changed, the spec's recovery is to call
      skills/get for that skill and continue from the current entry; skills/get exists so a
      change costs one entry instead of re-enumerating a catalog of thousands. A skill's
      identity across hosts is server plus uri.
    notable: >-
      saker separates identity from version the same way: a skill is addressed by a stable
      registry id or slug, and the digest is an optional pin parameter; a pin that no longer
      matches is refused, but the identity still resolves to the current version (and
      plugins gained resolution by stable id in the latest commit).
    where:
      - ext-skills@167da6c0d42c:specification/stable/skills.mdx#L447-L452
      - ext-skills@167da6c0d42c:docs/rationale.md#L35-L43
      - saker-skillhub@6a0a5538257b:pkg/handler/runtime_skill_handler.go#L290-L318
      - saker-skillhub@6a0a5538257b
    contrast: contradicts
    host: internal/app/distribution.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - c
      impact: 3
      evidence: 1
      effort: 3
      why: >-
        Core of the goal. a: distribution.go:166-190 rejects skills/get on an old URI, so
        the spec's recovery path fails after any update; b: no stable alias; c: every skill
        update. Contradicts a deliberate pinning design; a URI scheme change.
    final_score: 3
    decision: {state: candidate}

  - key: always-apply-core-skills
    domains:
      - skill-over-mcp
      - skill-recommendation
    layer: content
    what: >-
      A skill marked `metadata.skillport.alwaysApply: true` becomes a Core Skill: its id,
      description and SKILL.md location are listed in the server instructions of every
      session, outside search. SKILLPORT_CORE_SKILLS_MODE per client chooses auto (honour
      alwaysApply), explicit (only SKILLPORT_CORE_SKILLS ids) or none ("lighter context").
    notable: >-
      The skill analogue of non-deferred tools: a few procedures that must always be in view
      skip retrieval. The cost is that base context grows with every core skill, and in auto
      mode the flag comes from the skill's own frontmatter, so a skill added from any GitHub
      repo can promote itself into every client's instructions. The host has no always-on
      tier (its goal names "adding skills grows the agent's base context" as a failure); if
      it ever adds one, the switch belongs to the curator per connection, never to
      third-party frontmatter.
    where:
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/interfaces/mcp/instructions.py#L70-L86
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/indexing/public/query.py#L23-L47
      - skillport@51334ae94919:guide/configuration.md#L130-L156
    contrast: new
    host: internal/resolver/resolver.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: >-
        peripheral: conflicts with the base-context goal; recorded mainly for the trust
        point (third-party frontmatter must not choose always-on). No host failure.
    final_score: 0
    keywords:
      - alwaysApply
      - core skills
      - core_skills_mode
    decision: {state: candidate}

  - key: per-client-skill-filter
    domains:
      - skill-over-mcp
      - skill-recommendation
    layer: content
    what: >-
      One skills directory, several MCP server entries: each client's entry sets
      SKILLPORT_ENABLED_SKILLS, _NAMESPACES or _CATEGORIES (first non-empty wins), applied
      as a WHERE prefilter on search and as a check on load and read, so a filtered-out
      skill is "not found" to that client.
    notable: >-
      "Same skill repository, different views per client" narrows retrieval before ranking
      and keeps writing skills away from a coding agent. The host has collection ids and PRD
      §23 defines collections as "filter / authorization / search scope", but no
      per-connection scope exists; connect could write one into each project's server entry.
      Trade-off: filtering by env per server entry multiplies config entries.
    where:
