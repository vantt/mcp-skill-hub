  - key: bounded-file-fetch
    domains:
      - skill-over-mcp
    layer: history
    what: >-
      tech-leads-club bounded fetch_skill_files to 5 paths and a 50,000-character response
      that names what it truncated, because one unbounded call "could exceed the ~25k-token
      cap agents apply to tool responses and cost the turn"; it also strips frontmatter from
      read_skill because search already delivered it. pinkpixel-agentskills independently
      bounds get_skill by max_files (default 12, at most 50), max_chars_per_file (default
      5000) and a 25,000-character response limit, and reports total_files_in_skill and
      truncated_file_count.
    notable: >-
      Two independent servers that return a whole skill in one tool call arrived at the same
      ~25k response bound. Stripping frontmatter is not open to the host: the skills
      extension requires verbatim bytes so clients can verify digests. The bound matters
      only if a host serves large references in one call; one file per resources/read and a
      16 MiB skill cap make it unmeasured here.
    where:
      - tech-leads-club@568582cae974
      - tech-leads-club@120b67676388:packages/mcp/src/tools/core/fetcher.ts#L9-L12
      - pinkpixel-agentskills@47049d9635c5:src/github_skills_mcp/server.py#L130-L141
      - pinkpixel-agentskills@47049d9635c5:src/github_skills_mcp/server.py#L512-L550
    contrast: contradicts
    host: internal/app/distribution.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 3
      effort: 1
      why: >-
        In scope. peripheral: the host serves one verified file per read as the spec
        requires; no measured oversized read. Two independent sources converge, one
