    layer: content
    what: >-
      POST /api/runtime/skills/resolve takes up to 100 refs (id or slug, optional version
      and digest) and returns one result per input index, each with either the skill or its
      own error object, so one bad ref does not fail the batch. GET
      /api/runtime/capabilities announces a dated API version ("2026-06-17") and which
      features exist.
    notable: >-
      Useful when a client restores many pinned skills at session start (one round trip,
      partial success). peripheral: the host's agents resolve and load one skill per task,
      and MCP initialize already negotiates capabilities, so the batch form has no current
      consumer.
    where:
