  - key: fetch-by-branch-unpinned
    domains:
      - skill-over-mcp
      - trust-safety
    layer: content
    what: >-
      skills-mcp records each source's commit in the catalog, but get_skill and
      install_skill fetch from the branch name (falling back to master and main), so the
      content served can differ from what was indexed, with no digest check.
    notable: >-
      Shows why the host pins: it serves manifest-versioned, per-file digested content and
      refuses a digest mismatch.
    where:
      - skills-mcp@dc3dda4f8660:src/catalog.ts#L96-L104
      - skills-mcp@dc3dda4f8660:src/fetcher.ts#L18-L33
    contrast: already-covered
    host: internal/app/distribution.go
    score:
      relevance: 3
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered by digest-pinned distribution.
    decision: {state: candidate}

