  - key: per-file-digests-cover-supporting-files
    domains:
      - skill-over-mcp
      - trust-safety
    layer: history
    what: >-
      An earlier revision carried one digest covering only SKILL.md; a server could get
      approval for a benign skill and then rotate references/GUIDE.md. The spec moved to a
      complete, per-file resources set, and approval binds to it and is revoked when it
      changes.
    notable: >-
      Agrees with the host: per-file digests, a manifest over all files, approval bound to a
      content digest over every file.
    where:
      - ext-skills@167da6c0d42c:docs/rationale.md#L67-L71
      - ext-skills@167da6c0d42c:specification/stable/skills.mdx#L869-L876
