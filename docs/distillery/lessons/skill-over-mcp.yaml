  - key: registry-file-list-is-the-contract
    domains:
      - skill-over-mcp
    layer: history
    what: >-
      tech-leads-club's MCP served only files under scripts/, references/ and assets/, while
      the registry declared more: 76 files in 5 skills (59 in one) were unreachable over MCP
      although the CLI installed them. The fix: a bundled file is anything the registry
      declares, "a folder-name convention is not the contract". pinkpixel-agentskills shows
      the opposite error from the same convention: it derives a skill's files by directory
      prefix, and when SKILL.md sits at the repository root both branches of its filter
      append every path, so get_skill and install_skill of a root-level skill take the whole
      repository.
    notable: >-
      A file set inferred from folder layout fails in both directions (files missing, or the
      whole repo included). Two consumers of one catalog must agree on what a skill
      contains. The host builds its resources set from the files it indexes; this pass did
      not verify which files it excludes or how it scopes a root-level skill.
    where:
      - tech-leads-club@4805b5e60654
      - tech-leads-club@120b67676388:packages/mcp/src/utils.ts#L5-L16
      - pinkpixel-agentskills@47049d9635c5:src/github_skills_mcp/server.py#L392-L403
    contrast: new
    score:
      relevance: 3
      facts: []
      impact: 0
      evidence: 3
      effort: 1
      why: >-
        Core domain, but the host's inclusion rule was not verified in this pass (no fact
        a). Two independent sources show the convention failing.
    final_score: 0
    decision: {state: candidate}

