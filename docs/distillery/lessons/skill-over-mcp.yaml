  - key: digest-pinned-immutable-reads
    domains:
      - skill-over-mcp
      - trust-safety
    layer: content
    what: >-
      The runtime API builds a manifest per version (entrypoint, files sorted by path with
      size and sha256, dependencies) and a manifest digest over its canonical JSON. A caller
      may pass digest=; a mismatch is refused, a pinned read is served Cache-Control
      immutable for a year, an unpinned one private for 5 minutes, and each file carries
      ETag sha256:<hex> with 304 on If-None-Match. A yanked version answers 410 Gone.
    notable: >-
      Content addressing makes caching and integrity the same mechanism: the pin is the
      cache key. The host does the same over MCP (manifest digest as ETag, 304 for held
      digests, deterministic bundles), so this is independent confirmation, not a gap.
