  - key: search-and-install-disagree
    domains:
      - skill-recommendation
      - skill-over-mcp
    layer: content
    what: >-
      The design records a product limit. Search indexes one document per skill from the
      latest published version, so a user who installs by tag (`@beta`) may get content that
      differs from what search showed. Channel-aware search would need a version-level
      index.
    notable: >-
      When the discovery index and the delivery path read different versions, the
      recommendation describes content the agent never loads. The host avoids this: resolve
      and skills/get read the same catalog snapshot, and snapshot_expired signals a change.
      Recorded as confirmation of that design.
    where:
      - iflytek-skillhub@a463efb5352e:docs/04-search-architecture.md#L91-L104
    contrast: already-covered
    host: internal/catalog/servable.go
    score:
      relevance: 3
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered by one snapshot for resolve and serving.
    keywords:
      - search document
      - tag install
      - channel-aware search
      - version-level index
    decision: {state: candidate}
