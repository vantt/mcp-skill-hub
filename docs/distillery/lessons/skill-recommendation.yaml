  - key: lexical-channel-silently-degraded
    domains:
      - skill-recommendation
      - evaluation
    layer: history
    what: >-
      meta_skill dropped its SQLite FTS5 path because fsqlite does not plan FTS5 MATCH, and
      lexical search fell back to a substring scan; a later commit restored Tantivy BM25
      because the "lexical" half "carried no real BM25 signal".
    notable: >-
      A ranking channel can degrade to near-noise with every command still succeeding.
      skillport shows two more forms: scores were clamped to [0,1], so every BM25 score
      above 1 became 1.0 and ranking among strong matches was lost until a fix restored raw
      scores; and its chain vector -> FTS -> substring catches every failure and only prints
      to stderr, so an FTS index that failed to build silently turns search into a substring
      scan. The host guards this with routing evals and a CI gate on precision.
    where:
      - meta-skill@7650d0b9dd9e
      - meta-skill@73020b1efa2b
      - iflytek-skillhub@a463efb5352e:docs/04-search-architecture.md#L116-L120
      - skillport@9e04d26366e3
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/indexing/internal/search_service.py#L69-L94
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/indexing/internal/search_service.py#L145-L150
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/indexing/internal/lancedb.py#L258-L265
    contrast: already-covered
    host: .github/workflows/evaluation.yml
    score:
      relevance: 3
      facts: []
      impact: 0
      evidence: 2
      effort: 1
      why: Already covered by the host routing eval gate.
    decision: {state: candidate}

  - key: name-path-substring-search
    domains:
      - skill-recommendation
    layer: content
    what: >-
      search_skills scores each skill by substring matches of query tokens in its folder
      name and path (10 each), +25 when the whole query is inside the name and +15 for a
      name prefix; descriptions are never read, and the scaffold tool reuses the same score.
      README presents the server as the cure for noise like `rust` matching inside `trust`,
      yet the `token in haystack` substring test matches exactly that.
    notable: >-
      A name-only, substring scorer cannot tell what a skill does and leaks across word
      boundaries, which is exactly the "wrong skill" failure. The host searches frontmatter
      descriptions with FTS terms and returns explicit resolved, needs_context and no_skill
      outcomes.
    where:
      - pinkpixel-agentskills@47049d9635c5:src/github_skills_mcp/server.py#L336-L357
      - pinkpixel-agentskills@47049d9635c5:README.md#L45-L45
      - pinkpixel-agentskills@47049d9635c5:README.md#L184-L184
    contrast: already-covered
    host: internal/resolver/sqlite_catalog.go
    score:
      relevance: 3
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered by description FTS and resolver outcomes.
    keywords:
      - score
      - matched_terms
      - substring
    decision: {state: candidate}

