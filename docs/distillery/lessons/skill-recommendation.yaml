# Lessons whose primary domain is "skill-recommendation". Written by distill.mjs: edit freely, then run
# `distill.mjs format`. final_score = relevance × impact × evidence / effort (impact = number of
# facts); ranked lessons come first by final_score, then unranked ones by key.
lessons:

  - key: semantic-admission-gate
    domains:
      - skill-recommendation
    layer: history
    what: >-
      Before rank fusion, meta_skill drops vector candidates with similarity <= 0 and lets a
      lexical (feature-hash) embedder only re-rank documents BM25 already matched, never add
      new ones. The fix followed an incident: once embeddings were persisted, RRF gave every
      stored vector a positive contribution and `ms search rust` returned Testing Best
      Practices and Git Workflow.
    notable: >-
      RRF scores by rank alone, so any channel that always returns k results injects noise
      into the fused list. The admission rule keeps the cheap channel from introducing
      unrelated skills while still letting it re-order. The host's vector channel is off and
      doc 03 §13 requires a held-out gain before enabling it; this adds the concrete rule
      the design lacks for when it is enabled.
    where:
      - meta-skill@e999668e8d8c:src/search/hybrid.rs#L158-L172
      - meta-skill@50b6a3ca457e
    contrast: extends
    host: docs/design/03-resolver-design.md
    score:
      relevance: 3
      facts:
        - a
        - b
        - e
      impact: 3
      evidence: 2
      effort: 1
      why: >-
        Core of the goal (no wrong skill surfaced). a: doc 03 §13 plans a vector channel
        fused with BM25 and no rule that keeps unrelated vector hits out; b: §13 lists
        pinning, degrade and an eval gate but no admission rule; e: the source measured the
        failure (ms search rust returned Testing Best Practices). One source with a measured
        incident; one rule to add to the design.
    final_score: 18
    decision: {state: candidate}

  - key: model-callable-list-needs-guard
    domains:
      - skill-recommendation
      - skill-over-mcp
    layer: wording
    what: >-
      tech-leads-club's list_skills requires the literal argument explicit_request: true and
      says "Only when the user explicitly asks to see every skill", returning one short
      sentence per skill, so an agent does not pull the whole catalog into context instead
      of searching. zouyingcao-agentskills shows the unguarded alternative as its design: a
      no-argument load_skill_metadata returns one "- name: description" line for every
      SKILL.md, and both README and the demo system prompt tell the agent to call it first
      in every task.
    notable: >-
      A schema-level guard turns a wording rule into one the model cannot skip by accident;
      the second source shows what happens without one: the full catalog becomes a per-task
      fixed cost that grows with every skill added. The host's model-callable skill_list
      takes only an optional state filter, has no limit or guard, and its description does
      not steer the agent to skill_resolve; on a hub with hundreds of skills one call floods
      the context the goal protects.
    where:
      - tech-leads-club@120b67676388:packages/mcp/src/tools/list-tool.ts#L7-L37
      - >-
        zouyingcao-agentskills@32589389aacf:mcp_agentskills/core/tools/load_skill_metadata_op.py#L162-L189
      - zouyingcao-agentskills@32589389aacf:tests/skill_agent_prompt.py#L8-L10
      - zouyingcao-agentskills@32589389aacf:README.md#L214-L215
    contrast: new
    host: internal/delivery/mcpserver/skill_tools.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - d
      impact: 3
      evidence: 2
      effort: 1
      why: >-
        Core of the goal (load only what the task needs). a: skill_list returns the catalog
        with no limit or guard; b: nothing steers listing to explicit requests; d: a literal
        guard in the input schema enforces it. Two independent sources (one guard, one
        showing the unguarded dump as the default path); small change.
    final_score: 18
    decision: {state: candidate}

  - key: project-signal-detector
    domains:
      - skill-recommendation
      - host-integration
    layer: content
    what: >-
      `ms load --auto` detects the project type from marker files (Cargo.toml 1.0,
      package.json 0.9, go.mod 1.0, ...) plus recent files and tools, and scores skills with
      fixed weights: project type 0.40, file patterns 0.25, tools 0.20, signals 0.10,
      history 0.05.
    notable: >-
      The server derives context itself instead of trusting the agent to send it. The
      trade-off is that it must read the workspace. The host resolves from facts the agent
      supplies; its own FactProvider for workspace facts is designed (doc 03 §12) but not
      built.
    where:
      - meta-skill@e999668e8d8c:src/context/detector.rs#L297-L312
      - meta-skill@e999668e8d8c:src/context/scoring.rs#L87-L112
    contrast: extends
    host: docs/design/03-resolver-design.md
    score:
      relevance: 3
      facts:
        - a
        - b
        - c
      impact: 3
      evidence: 1
      effort: 2
      why: >-
        Core of the goal (the right skill). a: when the agent sends no facts the resolver
        cannot use obvious project context and picks or asks wrongly; b: FactProvider not
        built; c: applies to every resolve call. One source.
    final_score: 4.5
    decision: {state: candidate}

  - key: user-skill-preferences
    domains:
      - skill-recommendation
      - curation
    layer: content
    what: >-
      meta_skill stores per-user favorite and hidden preferences (user_preferences table);
      `ms suggest` drops hidden skills and adds 0.25 to favorites. Search and auto-load
      ignore them.
    notable: >-
      A person can shape suggestions without editing or deprecating a skill for everyone.
      For the host this fits better as a fact than a boost: hidden as a per-user hard
      exclusion and pinned as a tie-break, both explained by a reason code, applied on every
      resolution path.
    where:
      - meta-skill@e999668e8d8c:migrations/011_add_user_preferences.sql#L3-L9
      - meta-skill@e999668e8d8c:src/cli/commands/suggest.rs#L206-L225
    contrast: new
    host: internal/resolver/evidence.go
    score:
      relevance: 3
      facts:
        - a
        - b
      impact: 2
      evidence: 1
      effort: 2
      why: >-
        Core of the goal (the right skill, under the human's control). a: a user who never
        wants a skill suggested can only deprecate it for everyone; b: no per-user
        preference exists. One source, and only one of its paths applies it.
    final_score: 3
    decision: {state: candidate}

  - key: session-mining-drafts-only
    domains:
      - skill-recommendation
      - curation
      - source-learning
    layer: content
    what: >-
      meta_skill mines agent sessions (after a prompt-injection taint scan) into command,
      code, workflow and error patterns, and `ms build --guided` turns them into draft
      SKILL.md files without frontmatter; mining never adds tags or context to an existing
      skill.
    notable: >-
      Sessions hold the best evidence of how people phrase tasks, but the source spends it
      on new drafts. The host already imports transcripts and promotes resolutions into
      eval-case drafts, so it can take the step the source lacks: propose new routing
      examples, counter_examples or not_for for an existing skill from tasks that ended in
      no_skill then a chosen skill, or in a rejection, through the normal preview/confirm.
    where:
      - meta-skill@e999668e8d8c:src/cass/mining.rs#L671-L706
      - meta-skill@e999668e8d8c:src/cass/brenner.rs#L299-L339
    contrast: extends
    host: internal/telemetry/promotion.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - c
      impact: 3
      evidence: 1
      effort: 3
      why: >-
        Core of the goal (enrichment that makes the right skill findable). a: routing
        examples are only written by hand, so real phrasings that missed never improve them;
        b: nothing proposes metadata from telemetry; c: every resolution that misses. One
        source, and the host-side step is a new pipeline.
    final_score: 3
    decision: {state: candidate}

  - key: embedder-identity-in-index-state
    domains:
      - skill-recommendation
      - storage
    layer: content
    what: >-
      The index state stores the embedding provider and model next to the content hash; a
      change of either forces a reindex (provider_changed, model_changed). Config fails fast
      at load when provider=openai has no key, and embeddings default to none (BM25 only,
      "no API keys, privacy, speed").
    notable: >-
      Vectors from different models are not comparable, so an index must know which embedder
      produced it or a model switch silently mixes spaces. The host's vector channel is off;
      when it is enabled, the derived catalog's freshness key needs the embedder identity,
      and the off-by-default plus fail-fast pattern matches the host's Validate() on
      disabled channels.
    where:
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/indexing/internal/lancedb.py#L69-L76
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/indexing/internal/state.py#L114-L127
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/shared/config.py#L193-L197
    contrast: new
    host: internal/catalog/schema.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        peripheral: only matters once the vector channel exists. b: no embedder identity in
        the catalog freshness key; d: a field in the freshness check. Facts b/d would hold
        once the host has a concrete failure (fact a).
    final_score: 0
    keywords:
      - embedding_signature
      - provider_changed
      - model_changed
    decision: {state: candidate}

  - key: regex-domain-classifier
    domains:
      - skill-recommendation
      - skill-sources
    layer: content
    what: >-
      skills-mcp tags each skill with up to 20 domains by regex keyword lists over name,
      description and id; the first match is the primary tag, "other" the fallback; the same
      rules are shared with a second tool.
    notable: >-
      Cheap facets for browsing thousands of skills, but keyword regexes mis-tag freely and
      nothing reviews them. The host routes on curated triggers instead of categories.
    where:
      - skills-mcp@dc3dda4f8660:scripts/classify.mjs#L1-L24
      - skills-mcp@dc3dda4f8660:scripts/build-catalog.mjs#L243-L252
    contrast: new
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: >-
        peripheral: browsing facets; the host recommends from curated triggers, not
        categories. No host failure it prevents.
    final_score: 0
    decision: {state: candidate}

  - key: rrf-hybrid-fusion
    domains:
      - skill-recommendation
    layer: content
    what: >-
      meta_skill fuses Tantivy BM25 and embedding results with reciprocal rank fusion, k=60,
      weights 1.0 each, configurable in config.
    notable: >-
      RRF needs no score calibration between channels, unlike the host's linear sum of
      lexical, trigger, artifact and fact scores, but it discards score magnitude. Useful
      only if the host adds a second retrieval channel.
    where:
      - meta-skill@e999668e8d8c:src/search/hybrid.rs#L1-L37
    contrast: contradicts
    host: internal/resolver/policy.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: >-
        In scope. peripheral: RRF only matters once the host adds a second retrieval
        channel; no current failure comes from linear weighting. One source.
    final_score: 0
    decision: {state: candidate}

  - key: search-then-agent-picks
    domains:
      - skill-recommendation
      - skill-over-mcp
    layer: content
    what: >-
      search_skills(query) returns the top `search_limit` (default 10) rows as {id,
      description, score} plus `total`, sorted by raw BM25 (or vector) score; the
      description tells the agent "If too many results, refine your query with more specific
      terms instead of loading more", and "" or "*" lists everything. The agent reads the
      list and chooses which id to load_skill. Routing signal is only id, name, description,
      tags and category.
    notable: >-
      The Tool Search Tool pattern applied to skills: the server retrieves, the model ranks.
      It is cheap and transparent (the agent sees alternatives and scores) but costs up to
      ten descriptions (up to ~10 KB) per lookup, has no no-skill or ambiguity outcome, and
      leaves the final choice to a model reading descriptions. The host chose the opposite
      (PRD §29 "Agent should not re-rank", at most one primary or needs_context/no_skill
      with reasons) and PRD §58 keeps that choice open for review; skillport is the cleanest
      working example of the alternative, with no evals to show it picks well. Useful as the
      baseline arm if the host ever measures single-recommendation against
      agent-picks-from-list.
    where:
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/interfaces/mcp/tools.py#L23-L49
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/modules/skills/public/search.py#L11-L49
      - skillport@51334ae94919:guide/philosophy.md#L238-L258
    contrast: contradicts
    host: internal/resolver/resolver.go
    score:
      relevance: 3
      facts: []
      impact: 0
      evidence: 1
      effort: 3
      why: >-
        Core design fork, recorded for the PRD §58 discussion. No host failure is shown
        (fact a does not hold), so impact 0; adopting it would restructure resolution.
    final_score: 0
    keywords:
      - search_skills
      - tool search tool
      - search-first
      - refine query
    decision: {state: candidate}

  - key: bandit-adaptive-ranking
    domains:
      - skill-recommendation
      - evaluation
    layer: content
    what: >-
      Suggestions combine 0.7 × contextual score with 0.3 × a Thompson sample from a
      per-skill Beta posterior, plus a UCB-style exploration bonus after a cold start;
      feedback updates the bandit best-effort.
    notable: >-
      It adapts ranking to observed use, at the cost of non-reproducible results. The host's
      PRD §56 already says not to let bandit learning change routing without explainable,
      reproducible evaluation, and the resolver pins a policy_revision.
    where:
      - meta-skill@e999668e8d8c:src/suggestions/bandit/contextual.rs#L204-L233
    contrast: contradicts
    host: docs/PRD.md
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 3
      why: >-
        peripheral: the host refuses adaptive routing on purpose (PRD §56) and pins a
        policy_revision. Recorded for completeness.
    final_score: 0
    decision: {state: candidate}

  - key: registry-search-not-recommendation
    domains:
      - skill-recommendation
      - skill-over-mcp
    layer: ecosystem
    what: >-
      The registry has no MCP server and no task recommendation. Discovery is PostgreSQL
      full-text search (weighted title, summary, keywords and frontmatter text) with an
      optional semantic rerank. Its roadmap states that vector search is search enhancement
      only and that no recommendation system will be built. Agents reach skills only when
      the CLI copies them into one of 19 agent-specific skill folders.
    notable: >-
      A large, actively developed enterprise registry with the same name as the host's CLI
      chose search plus install-by-copy. That is exactly the model the host's goal rejects
      (copies drift; the agent must rank results). It strengthens the host's positioning:
      the registry competes on governance, while serving over MCP and one recommendation per
      task remain the host's distinct value. Peripheral as a mechanism, because it adds
      nothing the host should build.
    where:
      - iflytek-skillhub@a463efb5352e:docs/00-product-direction.md#L137-L145
      - iflytek-skillhub@a463efb5352e:docs/04-search-architecture.md#L139-L156
      - iflytek-skillhub@a463efb5352e:.mcp.json#L1-L11
    contrast: contradicts
    host: docs/PRD.md
    score:
      relevance: 3
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        peripheral: positioning evidence, not a mechanism to adopt; core domain, so
        relevance stays 3, but no host failure follows from it.
    final_score: 0
    keywords:
      - no MCP
      - full-text search
      - no recommendation
      - install by copy
    also_fits:
      - project:positioning
    decision: {state: candidate}

  - key: fuzzy-search-as-recommendation
    domains:
      - skill-recommendation
    layer: content
    what: >-
      skills-mcp's `recommend_skills` is the same Fuse.js fuzzy search as `search_skills`
      (weighted name 2, description 1.5, tags 1, threshold 0.32) run on the task text, with
      no no-skill decision beyond an empty result.
    notable: >-
      Shows the floor the host is designed above: the host resolver has explicit no_skill,
      needs_context and ambiguity outcomes with reason codes and absolute floors. skillport
      makes "always something" a stated principle: its threshold is relative to the top hit
      (keep rows with score/top >= 0.2), so the best match always survives however weak, and
      an empty FTS result falls back to a substring scan with a fixed score 0.1.
    where:
