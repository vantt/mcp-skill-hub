  - key: catalog-table-in-agents-md
    domains:
      - host-integration
      - skill-over-mcp
    layer: content
    what: >-
      For agents without MCP, `skillport doc` (and `init`) writes a block between <!--
      SKILLPORT_START/END --> markers into AGENTS.md / GEMINI.md: usage instructions plus an
      <available_skills> list with every skill's name, description and SKILL.md location;
      the agent then runs `skillport show <id>`. init prints "Tip: Edit instruction files to
      remove skills not relevant to this project" above five skills, and a later release
      added --no-instructions.
    notable: >-
      The CLI mode puts the whole catalog into every session's base context and copies it
      into each project, the two failures the host's goal lists; skillport's own tip to
      prune the file by hand is the symptom. The host's marker-replaced block carries only
      the protocol, never the catalog, and KeepInstructions covers the opt-out.
    where:
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/interfaces/cli/commands/doc.py#L82-L175
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/interfaces/cli/commands/init.py#L202-L223
      - skillport@ed8054ede3c2
    contrast: already-covered
    host: internal/hostintegration/bootstrap.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered; the host never writes the catalog into instruction files.
    keywords:
      - skillport doc
      - available_skills
      - AGENTS.md
      - markers
    decision: {state: candidate}

