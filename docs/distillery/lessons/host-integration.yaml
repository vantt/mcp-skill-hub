  - key: non-claude-agent-demo-loop
    domains:
      - host-integration
      - evaluation
    layer: validation
    what: >-
      A demo ReAct agent lists the server's tools over SSE, hands the four to a Qwen model
      via function calling with a system prompt that orders the workflow (metadata first,
      load, read references only when required, run scripts), and loops until the model says
      "task_complete". It prints results with no assertion, and the prompt's `{time}` slot
      is never filled because the template is rendered with Jinja (`{{ }}`).
    notable: >-
      An end-to-end run with a non-Anthropic model is the right kind of proof for "any MCP
      agent can use skills", but without an expected outcome it proves only that the loop
      ran. The host's routing evals score resolution, not whether a given client model
      follows the bootstrap and loads the skill; models-ignore-available-skills covers that
      gap.
    where:
      - zouyingcao-agentskills@32589389aacf:tests/skill_agent.py#L79-L161
      - zouyingcao-agentskills@32589389aacf:tests/run_skill_agent.py#L9-L21
      - zouyingcao-agentskills@32589389aacf:tests/skill_agent_prompt.py#L3-L5
    contrast: new
    host: internal/hostintegration/bootstrap.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: >-
        In scope (any MCP agent). No fact a beyond models-ignore-available-skills, which
        already records the failure; this adds no assertion to copy.
    final_score: 0
    keywords:
      - ReAct
      - qwen
      - task_complete
      - function calling
    decision: {state: candidate}

  - key: agent-guide-no-substitution-wording
    domains:
      - host-integration
      - skill-recommendation
    layer: wording
    what: >-
      The agent guide states several limits. "Install an exact Skill ... do not search for
      or substitute a similarly named package." "Discover ... search this registry first. If
      it is unavailable or has no suitable result, report that outcome and ask before
      querying another registry." "Never add --force unless ... the user approves."
      "Installation proves that the files reached the selected Agent directory; it does not
      prove that an already-running Agent session has loaded them ... report it as installed
      but not yet loaded."
    notable: >-
      Each sentence names the exact shortcut an agent would take: a look-alike package,
      another registry, --force, or claiming success. The host's resolve can return
      `no_skill` or `needs_context`, but the bootstrap block and curator should equally say
      what the agent must not do then. It should not pick a similarly named native skill,
      fetch one from the web, or claim a skill is active after `connect` without a restart.
      That keeps recommendation outcomes honest.
    where:
      - iflytek-skillhub@a463efb5352e:builtin-skills/skills/skillhub-cli/SKILL.md#L53-L60
      - iflytek-skillhub@a463efb5352e:builtin-skills/skills/skillhub-cli/SKILL.md#L87
      - iflytek-skillhub@a463efb5352e:builtin-skills/skills/skillhub-cli/SKILL.md#L112-L114
    contrast: extends
    host: internal/systemskills/curator/SKILL.md
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        In scope (agent instructions around resolve outcomes). b: the host wording on what
        to do after no_skill has not been checked against these substitutes. No observed
        host failure, so impact 0 by rule. One source. Facts b would hold once the host has
        a concrete failure (fact a).
    final_score: 0
    keywords:
      - similarly named
      - another registry
      - installed but not yet loaded
      - force
    decision: {state: candidate}

  - key: generic-mcp-command-name-collision
    domains:
      - host-integration
      - ux
    layer: ecosystem
    what: >-
      Both servers first published as the PyPI package `agentskills-mcp` and both renamed it
      (pinkpixel to `pinkpixel-agentskills-mcp`, zouyingcao to `mcp-agentskills`) without a
      stated reason, yet both still install a console command named `agentskills-mcp`.
      zouyingcao's README still configures `uvx agentskills-mcp`, which resolves the PyPI
      project of that name, not the package it now publishes.
    notable: >-
      A generic name in this space collides at three levels: package registry, executable on
      PATH, and the command users paste into MCP configs; the last one can silently run
      someone else's package. The host's naming survey (PRD §56) already found "skillhub"
      used by other CLIs; the binary name and any `npx`/`uvx`-style install line deserve the
      same check.
    where:
      - pinkpixel-agentskills@3001da10da06
      - pinkpixel-agentskills@47049d9635c5:pyproject.toml#L26-L28
      - zouyingcao-agentskills@e5c3058a7323
      - zouyingcao-agentskills@32589389aacf:pyproject.toml#L69-L70
      - zouyingcao-agentskills@32589389aacf:README.md#L94-L103
    contrast: new
    host: docs/PRD.md
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 2
      effort: 1
      why: >-
        Adjacent (naming and install). No fact a: the host's install command has not been
        shown to resolve to a foreign package. Two sources show the rename.
    final_score: 0
    keywords:
      - pypi rename
