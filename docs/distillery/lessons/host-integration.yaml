# Lessons whose primary domain is "host-integration". Written by distill.mjs: edit freely, then run
# `distill.mjs format`. final_score = relevance × impact × evidence / effort (impact = number of
# facts); ranked lessons come first by final_score, then unranked ones by key.
lessons:

  - key: models-ignore-available-skills
    domains:
      - host-integration
      - skill-recommendation
      - evaluation
    layer: validation
    what: >-
      The working group recorded independent reports that models often do not load or follow
      skills even when they are preloaded, that adherence decays as context grows and
      compaction happens, and that it is model-specific; workarounds were hooks that remind
      the model and wrapping skills in a similarly named subagent.
    notable: >-
      The hub's delivery depends on the agent calling skill_resolve because a bootstrap
      block in CLAUDE.md or AGENTS.md tells it to. If that instruction decays, the right
      skill is never requested, and nothing in the hub notices. The host's usage funnel can
      measure it; an enforcement (a hook-based reminder at task start) would act on it.
    where:
      - ext-skills@167da6c0d42c:docs/archive/experimental-findings.md#L423-L445
    contrast: extends
    host: internal/hostintegration/bootstrap.go
    score:
      relevance: 3
      facts:
        - a
        - b
        - c
        - e
      impact: 4
      evidence: 2
      effort: 2
      why: >-
        Core of the goal (the agent gets the right skill). a: delivery depends on an
        instruction models follow unreliably; b: no reminder or enforcement exists; c: every
        session; e: silent. Several independent reports in one source.
    final_score: 12
    decision: {state: candidate}

  - key: run-rules-moved-into-prose
    domains:
      - host-integration
      - skill-over-mcp
    layer: history
    what: >-
      Until v0.1.2 run_shell_command executed `cd {skill_dir}/{skill_name} && {command}`
      itself; v0.1.2 runs the agent's string as is and instead puts "EVERY command MUST
      start with: cd {skill_dir}/<skill_name> &&" and "Do NOT use absolute paths" into the
      tool description, while the demo system prompt says "always use absolute paths".
      skill_name is still required but no longer used to choose the directory.
    notable: >-
      An invariant the code used to guarantee became advice the model may skip, and two
      prompt layers now give opposite rules. The host is in the same position by design for
      scripts: skill_get's preflight tells the agent in prose to export SKILLHUB_SKILL_DIR,
      _STATE_DIR and _CONFIG_DIR, load the env file and run `check` in working_directory
      before scripts, and nothing verifies it was done. The hub must not run the commands,
      but it can hand a ready-to-run line (env assignments and cd included) so the agent
      copies one string instead of composing it.
    where:
      - zouyingcao-agentskills@b8da4303caaa
      - >-
        zouyingcao-agentskills@32589389aacf:mcp_agentskills/core/tools/run_shell_command_prompt.yaml#L1-L16
      - >-
        zouyingcao-agentskills@32589389aacf:mcp_agentskills/core/tools/run_shell_command_op.py#L143-L177
      - zouyingcao-agentskills@32589389aacf:tests/skill_agent_prompt.py#L23-L26
    contrast: extends
    host: internal/app/skill_snapshot.go
    score:
      relevance: 2
      facts:
        - a
        - c
        - d
      impact: 3
      evidence: 1
      effort: 1
      why: >-
        In scope (agents using served skills). a: skill_snapshot.go preflight relies on the
        agent following a prose export/cd instruction, so a skipped step runs scripts
        against the wrong state directory unnoticed; c: every script run of every runtime
        skill; d: lands as a generated command field. One source, the removal without a
        stated reason.
    final_score: 6
    keywords:
      - cd skill_dir
      - tool_desc
      - absolute paths
      - export env
    decision: {state: candidate}

  - key: native-and-mcp-same-name
    domains:
      - host-integration
      - trust-safety
    layer: content
    what: >-
      The spec makes skill names per-origin: a host must not let an MCP-served skill
      silently shadow or be substituted for a same-named skill from another origin,
      including the host's own filesystem skills, and should surface the collision to the
      user.
    notable: >-
      The hub installs system-curator as a native skill in each host's skills folder and
      also serves system-curator over MCP, so every connected host sees the same name from
      two origins, possibly at different versions. Another source hits the same collision
      locally. The install directory is the bare slug, so @team-a/x and @global/x collide in
      one agent folder, and the design only says the CLI "should detect and prompt".
    where:
      - ext-skills@167da6c0d42c:specification/stable/skills.mdx#L852-L858
      - iflytek-skillhub@a463efb5352e:docs/07-skill-protocol.md#L187-L198
    contrast: contradicts
    host: internal/hostintegration/integration.go
    score:
      relevance: 2
      facts:
        - a
        - b
      impact: 2
      evidence: 1
      effort: 1
      why: >-
        In scope (host integration). a: integration.go:33-35 installs it natively while
        distribution serves it too; b: nothing prevents the collision. One source; small
        change.
    final_score: 4
    decision:
      state: ported
      reason: >-
        Ported 2026-10-10: each supported client selects one curator source using the
        synchronized skills_extension matrix. Verified clients use MCP; other integrated
        clients retain native installation and skills/list plus skills/get omit the bundled
        curator for their normalized sessions. Installation receipts permit cleanup of
        unchanged older copies; user edits and unrecognizable legacy versions are reported
        and preserved. Unknown sessions retain MCP because native installation cannot be
        assumed. No stock client is currently verified, so native delivery stays unchanged
        for all supported hosts. Doctor skew reporting already existed; added its missing
        regression coverage.
      at: 167da6c0d42c
      local: >-
        c09742a matrix; e03ed41 native cutover; 5dee318 MCP filtering; 1b8c2f7 doctor skew
        test

  - key: agent-guide-contract-test
    domains:
      - host-integration
      - trust-safety
    layer: enforcement
    what: >-
      The CLI agent guide (skillhub-cli SKILL.md) is tested as an executable contract. CI
      checks it byte-for-byte against the copy the web server serves (`cmp`) and greps for
      required safety sentences. A Python block asserts that the sections appear in order
      (missing, install, existing, verified, foreign, confirm). It also asserts that
      forbidden actions ("npm install --global", "unlink an executable") do not appear
      inside the inspection section, and that the authorization paragraph keeps its limits.
    notable: >-
      Ordering and section scoping catch a reword that keeps every phrase but moves a write
      before the check that should guard it. A containment test misses that. The trade-off
      is brittle tests that must change with the wording. The host's embed tests check that
      the curator SKILL.md contains certain strings and that the distill-lab mirror equals
      its source. Nothing asserts the order of its approval and safety steps, or that a
      mutating command does not appear before the read-only inspection step.
    where:
      - iflytek-skillhub@a463efb5352e:scripts/tests/build-builtin-skills-test.sh#L21-L77
    contrast: extends
    host: internal/systemskills/embed_test.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        In scope (agent instructions). b: host tests check containment and mirror equality
        only. d: it is a test. No host failure is recorded yet, so impact stays 0 by rule.
        One source. Facts b/d would hold once the host has a concrete failure (fact a).
    final_score: 0
    keywords:
      - executable contract
      - section order
      - forbidden phrase
      - guide template
    decision: {state: candidate}

  - key: mcp-prompts-as-workflow-entry
    domains:
      - host-integration
      - curation
    layer: content
    what: >-
      The server registers two MCP prompts: create_skill (argument topic) returns a user
      message with the ordered steps and the tools to use, and resume_skill returns steps to
      check status and continue. Clients surface MCP prompts as user-invoked commands.
    notable: >-
      A prompt is a user-triggered entry point that costs nothing in the agent's base
      context (unlike a tool description) and gives every host the same start of a workflow.
      Trade-off: prompt support and presentation vary by client, and the text is advisory.
      The host starts curation through the explicit-only system-curator skill and the phrase
      "curate my Skill Hub"; a `curate` prompt would be a second, discoverable door to the
      same skill, not a replacement.
    where:
      - skill-forge-mcp@3211174026e6:src/index.ts#L308-L374
    contrast: new
    host: system-skills/curator/SKILL.md
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        Adjacent (host integration). No concrete failure today: curation is reachable
        through the curator skill and CLI.
    final_score: 0
    keywords:
      - registerPrompt
      - create_skill
      - resume_skill
      - slash command
    decision: {state: candidate}

  - key: agent-operations-guide-url
    domains:
      - host-integration
      - ux
    layer: content
    what: >-
      The server publishes /skills.md, a Markdown guide generated per request with the
      instance's base URL, written for an agent ("Read https://<host>/skills.md and follow
      the instructions"): health check, discovery, search, download with ETag, device-flow
      auth, publish, error codes; /.well-known/clawhub.json lists every endpoint including
      the guide.
    notable: >-
      An agent can onboard to a remote registry from one URL with no install step, and the
      guide cannot drift in base URL because the server renders it. The trade-off is a long
      hand-built string that drifts in content (its visibility values are already wrong).
      For the host's remote hub, a served onboarding page could replace pasting connect
      instructions, but the host prefers a CLI that writes host config.
