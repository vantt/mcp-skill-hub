  - key: import-boundary-grep-check
    domains:
      - code-structure
    layer: craft
    what: >-
      The documented module rule is "domain is the innermost layer, infra implements domain
      repository ports, no domain->infra". CI enforces part of it with a script that greps
      protected domain packages for forbidden imports (auth, controller, infra ...) and for
      protocol words (oidc, oauth, saml, scim ...). Each violation is reported with a label.
    notable: >-
      An architecture rule enforced by a cheap check instead of review. The host states
      boundaries in package comments ("independently of delivery adapters") but has no
      depguard or import test, so a delivery import into internal/skill would pass CI. Off
      the goal's main subject (code craft), hence unclassified and low relevance.
    where:
      - >-
        iflytek-skillhub@a463efb5352e:scripts/check-enterprise-identity-architecture.sh#L34-L60
      - iflytek-skillhub@a463efb5352e:docs/01-system-architecture.md#L30-L44
    contrast: new
    host: .golangci.yml
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        Adjacent (code structure). b: no host import-boundary check. d: one CI rule. No goal
        failure. Facts b/d would hold once the host has a concrete failure (fact a).
    final_score: 0
