  - key: nil-safe-optional-component
    domains:
      - code-structure
      - storage
    layer: craft
    what: >-
      SkillCache is an expirable LRU whose every method is a no-op on a nil receiver; a size
      <= 0 returns nil, so "cache off" needs no if-guards. Get and Set copy the struct so
      callers cannot mutate the cached entry; "not found" is never cached so a new skill is
      visible at once; the service invalidates on metadata writes and accepts TTL staleness
      for counters. Tests lock the nil-safe contract.
    notable: >-
      Making the disabled state a nil value removes a class of guard bugs and keeps the
      option testable. Small for the host, which has no in-memory hot-path cache; it fits
      any optional collaborator (recorder, tracker) that is sometimes absent.
    where:
      - saker-skillhub@6a0a5538257b:pkg/repository/skill_cache.go#L25-L95
      - saker-skillhub@6a0a5538257b:pkg/repository/skill_cache_test.go#L20-L49
      - saker-skillhub@ef8c84cf65df
    contrast: new
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Adjacent Go craft; no host failure.
    final_score: 0
    keywords:
      - nil receiver
      - LRU
      - expirable
      - InvalidateCache
      - negative cache
    decision: {state: candidate}

  - key: idempotent-close-sync-once
    domains:
