  - key: driver-registry-blank-import
    domains:
      - code-structure
      - storage
    layer: craft
    what: >-
      Storage backends register through store.Register(name, factory) in their init(), like
      database/sql: a duplicate name panics, Open("") defaults to git, an unknown name
      errors with the list of registered drivers, and the binary blank-imports all three
      backends so embedders can drop some.
    notable: >-
      A clean Go extension point with a helpful failure for the common mistake (forgotten
      blank import). The host keeps Git as its only store by design, so there is nothing to
      plug in.
    where:
      - saker-skillhub@6a0a5538257b:pkg/store/driver.go#L41-L89
      - saker-skillhub@6a0a5538257b:cmd/skillhub/main.go#L21-L28
    contrast: new
    score:
      relevance: 0
      facts: []
      impact: 0
      evidence: 1
      effort: 2
      why: Outside the goal (replacing Git as the store is out of scope).
    keywords:
      - driver registry
      - Register
      - blank import
      - Factory
    decision: {state: candidate}

  - key: hardening-lands-on-one-path
    domains:
      - code-structure
      - trust-safety
      - skill-sources
    layer: craft
    what: >-
      saker has parallel code paths for skills and plugins. The plugin path was hardened
      after review: install stages into a temp dir, validates, swaps atomically with
      rollback, rejects traversal and symlink entries, and checks the version-exists rule
      inside the DB transaction. The skill path still clears the target first, silently
      skips unsafe entries, follows no symlink check, and checks version existence outside
      the transaction. The directory readers of both are copy-pasted.
    notable: >-
      A fix applied to one of two near-duplicate paths leaves the other with the bug, and
      nothing flags the gap. The host has one bundle extraction path (staging, symlink
      refusal, atomic rename); keeping one shared helper per safety rule is what prevents
      this drift.
    where:
      - saker-skillhub@6a0a5538257b:pkg/cli/plugins.go#L524-L617
      - saker-skillhub@6a0a5538257b:pkg/cli/commands.go#L282-L330
      - saker-skillhub@6a0a5538257b:pkg/service/plugin_service.go#L270-L274
      - saker-skillhub@6a0a5538257b:pkg/service/skill_service.go#L446-L461
      - saker-skillhub@3304f5228693
    contrast: already-covered
    host: internal/skillruntime/remote_cache.go
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Adjacent; host has one extraction path.
    keywords:
      - atomic install
      - staging
      - symlink
      - TOCTOU
      - duplicate path
    decision: {state: candidate}

  - key: options-swallow-errors
    domains:
      - code-structure
      - ux
    layer: craft
    what: >-
      The embedding SDK uses functional options; WithConfigFile ignores a load error and
      keeps the defaults, and WithConfig, WithDB, WithLogger and others silently ignore nil.
    notable: >-
      A misspelled config path starts a hub on defaults with no error. Functional options
      that can fail need an error path (validate in New, or an option type that returns
      error). The host has no SDK; recorded as a pattern to avoid if one appears.
    where:
      - saker-skillhub@6a0a5538257b:options.go#L60-L82
    contrast: new
    score:
      relevance: 0
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Outside the goal (host is not an embeddable library).
    keywords:
      - functional options
      - WithConfigFile
      - silent fallback
    decision: {state: candidate}

  - key: tests-copy-server-wiring-drift
    domains:
      - code-structure
      - evaluation
      - skill-over-mcp
    layer: validation
    what: >-
      Integration tests connect a real MCP Client over InMemoryTransport, but because
      src/index.ts registers everything at module top level and connects stdio on import,
      each test file re-registers its own copy of the resources, tools and prompts. The
      copies have drifted: Japanese titles after the English-only change, mark_progress
      without saveState, shorter prompt text, no outputSchema on one tool. Test names carry
      requirement ids (R-1, T-5, S-2).
    notable: >-
      skillport shows the cure: create_mcp_server() builds the configured FastMCP instance
      without starting it ("enables testing with fastmcp.Client(transport=mcp)"), run_server
      reuses it, and the integration tests connect an in-memory client to that same factory
      and assert the exact tool list per mode, so tests cannot drift from production wiring.
      The host's tests likewise build the server through its own constructor.
    where:
      - skill-forge-mcp@3211174026e6:tests/resources.test.ts#L14-L20
      - skill-forge-mcp@3211174026e6:tests/resources.test.ts#L80-L84
      - skill-forge-mcp@3211174026e6:tests/tools.test.ts#L109-L125
      - skill-forge-mcp@3211174026e6:src/index.ts#L14-L24
      - >-
        skillport@51334ae94919:packages/skillport-core/src/skillport/interfaces/mcp/server.py#L49-L69
      - skillport@51334ae94919:tests/integration/test_mcp_server.py#L59-L83
    contrast: already-covered
    host: internal/delivery/mcpserver/server.go
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Already covered by New() plus in-memory transport tests.
    keywords:
      - InMemoryTransport
      - createTestServer
      - test drift
    decision: {state: candidate}
