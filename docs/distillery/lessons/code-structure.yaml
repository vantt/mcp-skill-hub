# Lessons whose primary domain is "code-structure". Written by distill.mjs: edit freely, then run
# `distill.mjs format`. final_score = relevance × impact × evidence / effort (impact = number of
# facts); ranked lessons come first by final_score, then unranked ones by key.
lessons:

  - key: sentinel-errors-not-message-matching
    domains:
      - code-structure
      - ux
      - skill-over-mcp
    layer: history
    what: >-
      saker maps service errors to HTTP status with sentinel errors (ErrForbidden,
      ErrNotFound, ErrConflict, ErrValidation) and errors.Is/As; a typed AmbiguousSlugError
      carries its candidate list and implements Is(ErrConflict) so one value both
      categorises and carries payload. The switch came after string-prefix matching
      ("forbidden:") let a 403 silently become 400 when a message was reworded, and after a
      test passed falsely on string matching. The newest handler (runtime API) nevertheless
      classifies by substrings again ("not found", "version", "file", "invalid").
    notable: >-
      An error's category (the code and retryable flag an agent acts on) must not depend on
      its wording; otherwise editing a message silently changes the contract, and nothing
      fails. The trade-off is one exported sentinel or typed error per category and wrapping
      with %w at every return. The host's ClassifyError still ends in classifySubstringRules
      and knownRequestMessage, which map any message containing " must ", "not found",
      "invalid" or "conflict" to invalid_request with retryable false: an internal "file not
      found" becomes a non-retryable validation error with the wrong FIX. saker's own
      regression shows the rule erodes unless a check forbids strings.Contains(err.Error())
      in classifiers.
    where:
      - saker-skillhub@6a0a5538257b:pkg/service/errors.go#L5-L54
      - saker-skillhub@6a0a5538257b:pkg/handler/errors.go#L12-L50
      - saker-skillhub@6a0a5538257b:pkg/handler/runtime_skill_handler.go#L676-L700
      - saker-skillhub@6a0a5538257b:pkg/handler/agent_skill_handler.go#L381-L400
      - saker-skillhub@b129b5306fae
      - saker-skillhub@d9c4aeb7d1df
    contrast: extends
    host: internal/app/error_classify.go
    score:
      relevance: 2
      facts:
        - a
        - b
        - c
        - d
        - e
      impact: 5
      evidence: 2
      effort: 2
      why: >-
        In scope (agent-facing errors and FIX text). a: host
        classifySubstringRules/knownRequestMessage (error_classify.go L239-L315) give
        category by wording, so a reworded or foreign "not found" message is misclassified;
        b: host has sentinels for some paths but a substring fallback; c: saker hit it three
        times (403->400, false-passing test, runtime handler regression) and the host has 7
        substring rules; d: lands as a test that bans substring checks in classifiers; e:
        silent, and saker's commits fix a real incident. One source.
    final_score: 10
    keywords:
      - sentinel error
      - errors.Is
      - errors.As
      - writeServiceError
      - AmbiguousSlugError
      - string prefix
      - P3-12
    decision: {state: candidate}

  - key: cli-and-server-dependency-boundary-tests
    domains:
      - code-structure
      - ux
      - host-integration
    layer: enforcement
    what: >-
      After splitting into skillport (CLI), skillport-mcp (server) and skillport-core, tests
      enforce the boundary: importing the CLI in a fresh subprocess must not load lancedb,
      fastmcp, tantivy, openai or the indexing module; CLI sources must not mention those
      imports; CLI and core pyproject dependencies must exclude server packages; all three
      versions and the core pin must match; and nested lockfiles are refused.
    notable: >-
      An architecture rule becomes a failing test instead of a reviewer's memory, and the
      subprocess import check catches transitive imports a grep misses. The host is one Go
      binary, so the packaging half does not transfer; the import-graph half could keep the
      runtime MCP profile from pulling curation code paths if startup cost ever matters.
    where:
      - skillport@51334ae94919:tests/unit/test_dependency_boundaries.py#L19-L110
      - skillport@bb03e3a374b1
    contrast: new
    host: internal/delivery/mcpserver/startup_bench_test.go
    score:
      relevance: 1
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: Adjacent craft; no host boundary is failing today.
    final_score: 0
    keywords:
      - dependency boundary
      - lazy import
      - split distributions
    decision: {state: candidate}

  - key: property-tests-on-search-invariants
    domains:
      - code-structure
      - skill-recommendation
      - evaluation
    layer: validation
    what: >-
      Hypothesis property tests pin invariants rather than examples: for any list of
      positive scores the search keeps exactly the rows with score/top >= threshold, in
      order, cut to the limit (against a fake table); query and tag normalization are
      idempotent trims; generated valid names always pass and names with one invalid
      character always fail.
    notable: >-
      A property test states the ranking contract (floor, order, limit) once and checks it
      on hundreds of generated inputs, catching edge cases example tests miss. The host
      fuzzes parsers and path confinement and runs routing evals, but has no property test
      that the resolver's floors, margin and candidate limit hold for arbitrary scores.
    where:
      - skillport@51334ae94919:tests/unit/test_normalization_and_threshold.py#L69-L89
      - skillport@51334ae94919:tests/pbt/test_name_properties.py#L40-L60
    contrast: extends
    host: internal/resolver/resolver_test.go
    score:
      relevance: 2
      facts: []
      impact: 0
      evidence: 1
      effort: 1
      why: >-
        peripheral: a test technique for the resolver, not routing behaviour; no current
        host failure (fact a does not hold). b: no property test on policy invariants; d:
        lands as a Go fuzz/property test. Facts b/d would hold once the host has a concrete
        failure (fact a).
    final_score: 0
    keywords:
