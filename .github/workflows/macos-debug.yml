name: macOS git debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.mode }})
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [go1260, go-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.mode == 'go1260' && '1.26.0' || '1.26' }}
          check-latest: ${{ matrix.mode == 'go-latest' }}
      - name: Environment
        run: |
          which -a git
          git --version
          sw_vers
          sysctl -n hw.ncpu
      - name: Hammer the cli package
        shell: bash
        run: |
          go version
          flags=""
          for i in 1 2; do
            echo "=== round $i"
            go test -race -count=1 $flags ./internal/delivery/cli ./internal/app || exit 1
          done
      - name: Crash reports
        if: failure()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -20
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/* 2>/dev/null | head -2); do echo "--- $f"; head -c 6000 "$f"; done
