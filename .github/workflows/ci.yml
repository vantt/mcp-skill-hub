name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
      # GitHub's Windows runners keep %TEMP% and the Go build cache on the slow
      # C: drive and scan every new file with Defender. The suite is dominated
      # by file creation, fsync and process spawns, and ran ~100x slower than
      # on Linux (22-31 min, then past the 30m timeout). Keep scratch files on
      # the D: work drive and exclude them from real-time scanning.
      - name: Fast scratch space (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\tmp, D:\gocache | Out-Null
          "TMP=D:\tmp" >> $env:GITHUB_ENV
          "TEMP=D:\tmp" >> $env:GITHUB_ENV
          "GOCACHE=D:\gocache" >> $env:GITHUB_ENV
          try { Add-MpPreference -ExclusionPath 'D:\tmp','D:\gocache',"$env:GITHUB_WORKSPACE" } catch { Write-Warning "Defender exclusion not applied: $_" }
      - name: Test
        if: matrix.os != 'windows-latest'
        run: go test -timeout 30m ./...
      - name: Test (Windows, with per-test timings)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -v -timeout 60m ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Slowest Windows tests
        if: always() && matrix.os == 'windows-latest'
        shell: bash
        run: |
          grep -E '^\s*--- (PASS|FAIL): ' "$RUNNER_TEMP/go-test.log" | sed -E 's/.*--- (PASS|FAIL): (\S+) \(([0-9.]+)s\).*/\3 \2/' | sort -rn | head -40 || true
      - name: Race test
        if: matrix.os != 'windows-latest'
        run: go test -race -timeout 30m ./...
      - name: Performance budgets
        shell: bash
        env:
          SKILLHUB_PERF: "1"
        run: go test -p 1 -count=1 -run 'Performance' ./...
      - name: Vet
        run: go vet ./...

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal schemas)"

  lint:
    name: Lint (new issues)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
      - name: golangci-lint on changes since the base revision
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make lint LINT_BASE="$BASE_SHA"

  installer-lifecycle:
    name: Installer lifecycle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/install.sh
      - name: Test install, upgrade, rollback, and uninstall
        shell: bash
        run: scripts/test-installer-lifecycle.sh

  installer-windows:
    name: Windows installer lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test Windows installer
        shell: pwsh
        run: scripts/test-installer-windows.ps1

  fuzz:
    name: Bounded fuzz (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: canonical
            package: ./internal/canonical
            target: FuzzCanonicalParsersAndPaths
          - name: mutation
            package: ./internal/mutation
            target: FuzzMutationPathConfinement
          - name: mcpserver
            package: ./internal/delivery/mcpserver
            target: FuzzMCPFrameAndInputHelpers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
      - name: Fuzz ${{ matrix.name }}
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=15s -timeout=3m

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - name: Frontend checks and build
        run: make web-check
      - name: Install Playwright browsers
        run: npx --prefix web playwright install --with-deps chromium
      - name: E2E smoke tests
        run: make web-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: internal/delivery/web/dist
          if-no-files-found: error

  cross-compile:
    name: Cross-compile smoke check
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: web-dist
          path: internal/delivery/web/dist
      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build -o skillhub-${{ matrix.target.goos }}-${{ matrix.target.goarch }} ./cmd/skillhub
